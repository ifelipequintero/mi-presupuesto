<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Presupuesto</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presupuesto">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: phone-first iOS app — large-title header, inset grouped lists, floating + button, bottom tab bar, bottom sheets for editing */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --sep:rgba(60,60,67,.16);
  --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32); --fill:rgba(118,118,128,.14);
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --on:#FFFFFF;
  --bar:rgba(249,249,249,.86); --shade:rgba(0,0,0,.32);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --sep:rgba(84,84,88,.55);
  --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3); --fill:rgba(118,118,128,.28);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --on:#FFFFFF;
  --bar:rgba(22,22,24,.86); --shade:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --sep:rgba(84,84,88,.55);
  --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3); --fill:rgba(118,118,128,.28);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --on:#FFFFFF;
  --bar:rgba(22,22,24,.86); --shade:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.3;letter-spacing:-.01em}
.n{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}

/* header */
.head{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:8px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.headrow{display:flex;align-items:center;gap:6px;min-height:28px}
.save{font-size:13px;color:var(--label2);margin-right:auto}
.save.err{color:var(--red)}
.chev{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;color:var(--blue);background:var(--fill)}
.chev svg{width:16px;height:16px}
.today{font-size:15px;color:var(--blue);padding:6px 8px}
.title{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0;text-transform:capitalize;line-height:1.15}
.eyebrow{font-size:13px;color:var(--label2);font-weight:600;text-transform:uppercase;letter-spacing:.02em}

/* sections and lists */
.sec{margin-top:26px}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 16px 7px;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.01em}
.sech b{font-weight:400;text-transform:none}
.foot{padding:7px 16px 0;font-size:13px;color:var(--label2);line-height:1.35}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:48px;position:relative;width:100%;text-align:left}
.cell + .cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
button.cell:active,.cell.tap:active{background:var(--fill)}
.cell .main{flex:1;min-width:0}
.cell .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .s{font-size:13px;color:var(--label2);margin-top:2px}
.cell .v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.cell .v small{display:block;font-size:13px;color:var(--label2)}
.cell .arrow{color:var(--label3);flex:none}
.cell .arrow svg{width:8px;height:13px;display:block}
.cell.blue{color:var(--blue)}
.cell input,.cell select{border:0;background:transparent;text-align:right;min-width:0;flex:1;padding:0;outline:none}
.cell input:focus{color:var(--blue)}
.cell label{white-space:nowrap}
.pbar{height:4px;border-radius:2px;background:var(--fill);margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:2px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--fill);color:var(--label2);vertical-align:2px;margin-left:6px}
.red{color:var(--red)} .green{color:var(--green)} .orange{color:var(--orange)} .muted{color:var(--label2)}

/* summary card */
.sum{background:var(--card);border-radius:16px;padding:18px 16px 14px;margin-top:8px}
.sum .big{font-size:40px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;margin-top:10px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.pill.warn{color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent)}
.pill.bad{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;padding-top:14px;border-top:.5px solid var(--sep)}
.stat{min-width:0}
.stat .l{font-size:12px;color:var(--label2)}
.stat .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.stat .s{font-size:11px;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.note{background:var(--card);border-radius:12px;padding:12px 16px;font-size:15px;color:var(--label2);line-height:1.4}
.note b{color:var(--label)}
.btnrow{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.btn{background:var(--blue);color:var(--on);border-radius:12px;padding:14px 18px;font-weight:600;font-size:17px;width:100%;text-align:center}
.btn:active{opacity:.7}
.btn.tint{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.btn.danger{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.btn.small{width:auto;padding:9px 14px;font-size:15px;border-radius:10px}

/* segmented control */
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px;flex:none}
.seg button{padding:5px 14px;border-radius:7px;font-size:14px;font-weight:500;color:var(--label)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
.seg.wide{display:grid;width:100%}

/* goal */
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:92px;height:92px;flex:none}
.meter{height:8px;background:var(--fill);border-radius:4px;position:relative;margin-top:14px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--orange)}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--label);opacity:.55}
.chart{background:var(--card);border-radius:12px;padding:12px 8px 8px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--label2);padding:6px 8px 2px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
input[type=range]{width:100%;accent-color:var(--blue)}
textarea{width:100%;min-height:120px;border:0;background:transparent;resize:vertical;outline:none;line-height:1.4}

/* fab + tab bar */
.fab{position:fixed;z-index:20;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px),calc(50vw - 260px + 18px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:28px;background:var(--blue);color:var(--on);display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--blue) 40%,transparent)}
.fab svg{width:24px;height:24px}
.fab:active{transform:scale(.94)}
.tabbar{position:fixed;z-index:20;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:10px;font-weight:500;color:var(--label2)}
.tabbar button svg{width:25px;height:25px}
.tabbar button[aria-selected="true"]{color:var(--blue)}

/* sheet */
.sheetroot{position:fixed;inset:0;z-index:40}
.backdrop{position:absolute;inset:0;background:var(--shade)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:calc(100% - 40px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:14px 14px 0 0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheethead{position:sticky;top:0;z-index:1;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 0 10px}
.sheethead::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;border-radius:3px;background:var(--label3);transform:translateX(-50%)}
.sheethead h2{font-size:17px;font-weight:600;margin:12px 0 0;text-align:center}
.sheethead button{color:var(--blue);font-size:17px;padding:12px 0 0;justify-self:start}
.sheethead button.r{justify-self:end;font-weight:600}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:14px 0 6px}
.amount span{font-size:30px;color:var(--label2);font-weight:600}
.amount input{font-size:44px;font-weight:700;border:0;background:transparent;min-width:1.2ch;max-width:calc(100% - 60px);text-align:left;padding:0;outline:none;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.err{color:var(--red);font-size:14px;text-align:center;padding:4px 0}
@media (prefers-reduced-motion:no-preference){
  .sheetroot.anim .sheet{animation:up .32s cubic-bezier(.2,.9,.25,1)}
  .sheetroot.anim .backdrop{animation:fade .25s ease}
  .pbar i,.meter i{transition:width .35s ease}
}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;z-index:50;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--card2);color:var(--label);padding:10px 16px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.18);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px 20px;text-align:center;color:var(--label2);font-size:15px;line-height:1.4}
</style>
</head>
<body>

<div id="app"><div class="app"><div class="head"><div class="headrow"><span class="save">Cargando…</span></div><h1 class="title">Mi Presupuesto</h1></div><p class="empty">Cargando tu presupuesto…</p></div></div>

<script>
(() => {
/* ================= model ================= */
const GROUPS = [
  {kind:'income',  name:'Ingresos',         act:'Recibido', color:'var(--green)'},
  {kind:'fixed',   name:'Gastos fijos',     act:'Gastado',  color:'var(--blue)'},
  {kind:'variable',name:'Gastos variables', act:'Gastado',  color:'var(--blue)'},
  {kind:'invest',  name:'Inversión',        act:'Aportado', color:'var(--orange)'}
];
const GNAME = Object.fromEntries(GROUPS.map(g=>[g.kind,g.name]));
const TEMPLATE = {
  income:['Salario','Ingresos extra'],
  fixed:['Arriendo / hipoteca','Servicios públicos','Internet y celular','Transporte','Salud / seguros','Deudas / tarjetas','Fondo de emergencia'],
  variable:['Mercado','Restaurantes y domicilios','Entretenimiento','Ropa y cuidado personal','Imprevistos'],
  invest:['Aporte a mi meta']
};
const EXAMPLE = {'Salario':6500000,'Arriendo / hipoteca':1800000,'Servicios públicos':280000,'Internet y celular':150000,'Transporte':300000,
  'Salud / seguros':250000,'Deudas / tarjetas':300000,'Fondo de emergencia':300000,'Mercado':900000,'Restaurantes y domicilios':350000,
  'Entretenimiento':200000,'Ropa y cuidado personal':170000,'Imprevistos':200000,'Aporte a mi meta':1300000};

const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'') : Math.random().toString(36).slice(2)+Date.now().toString(36)).slice(0,14);
const pad = n => String(n).padStart(2,'0');
const now = new Date();
const todayKey = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
const todayDate = `${todayKey}-${pad(now.getDate())}`;
const idxOf = k => { const [y,m] = String(k).split('-').map(Number); return y*12 + (m-1); };
const keyOf = i => `${Math.floor(i/12)}-${pad(i%12+1)}`;
const dt = (k,o) => { const [y,m]=k.split('-').map(Number); return new Intl.DateTimeFormat('es-CO',o).format(new Date(y,m-1,1)); };
const monthName = k => dt(k,{month:'long',year:'numeric'});
const monthOnly = k => dt(k,{month:'long'});
const monthShort = k => dt(k,{month:'short',year:'numeric'});
const dayLabel = d => { const [y,m,dd]=d.split('-').map(Number); const s=new Intl.DateTimeFormat('es-CO',{weekday:'long',day:'numeric',month:'long'}).format(new Date(y,m-1,dd)); return d===todayDate?'Hoy':s; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const RULES = {
  min:{name:'Mínimo saludable', n:60, g:25, s:15,
    why:'Fidelity recomienda ahorrar al menos el 15 % de lo que ganas para tu retiro. Es el punto de partida si tus gastos fijos son altos.'},
  balanced:{name:'Equilibrada', n:50, g:30, s:20,
    why:'La regla 50/30/20 de Elizabeth Warren (libro “All Your Worth”, 2005): la mitad para lo necesario, 30 % para gustos y 20 % para ahorrar e invertir.'},
  fast:{name:'Acelerada', n:50, g:20, s:30,
    why:'La tasa de ahorro es lo que más acorta el camino: ahorrando 30 % podrías vivir de tus inversiones en unos 28 años, frente a unos 43 ahorrando 15 % (regla del 4 % y 5 % de rentabilidad real).'}
};
const RULE_KEYS = ['min','balanced','fast'];
const BUCKET = {n:'Necesidades', g:'Gustos', s:'Ahorro e inversión'};
const defaultRule = () => ({active:'balanced', opts:Object.fromEntries(RULE_KEYS.map(k=>[k,{n:RULES[k].n, g:RULES[k].g, s:RULES[k].s}]))});
const defaultSettings = () => ({
  currency:'COP', trm:4000, rules:'', theme:'auto', trmMode:'auto', trmAuto:null, trmHist:{}, rule:defaultRule(),
  goal:{name:'Mi meta de inversión', target:100000000, cur:'COP', years:5, rate:10, initial:0, start:todayKey}
});
const S = { settings:defaultSettings(), months:{}, cur:todayKey, tab:'budget', mode:'loading', sheet:null, txFilter:'', toast:null, lastItem:null };

/* ================= money ================= */
const CURS = ['COP','USD'];
const base = () => S.settings.currency || 'COP';
const gcur = () => S.settings.goal.cur || 'COP';
const trmOf = k => { const m=S.months[k]; return Number(m && m.trm) || Number((S.settings.trmHist||{})[k]) || Number(S.settings.trm) || 4000; };
const conv = (a, from, to, trm) => { a=Number(a)||0; if (from===to) return a; return from==='USD' ? a*trm : a/trm; };
const fmtCache = {};
function money(n, c){
  c = c || base();
  const key = c;
  const f = fmtCache[key] || (fmtCache[key] = new Intl.NumberFormat('es-CO',{style:'currency',currency:c,minimumFractionDigits:0,maximumFractionDigits:c==='COP'?0:2}));
  const v = Math.round((Number(n)||0)*100)/100;
  return f.format(Math.abs(v) < 0.005 ? 0 : v);
}
const plain = (n, c) => n ? new Intl.NumberFormat('es-CO',{maximumFractionDigits:(c||base())==='COP'?0:2}).format(n) : '';
const compact = n => new Intl.NumberFormat('es-CO',{notation:'compact',maximumFractionDigits:1}).format(n);
const sym = c => c==='USD' ? 'US$' : '$';
/* accepts 1.200.000 · 1,200,000 · 1200000 · 12.5 · 12,5 · 1.200,50 */
function parseNum(s){
  let t = String(s ?? '').trim().replace(/[^\d.,\-]/g,''); if (!t) return 0;
  const neg = t.startsWith('-'); t = t.replace(/-/g,'');
  const i = Math.max(t.lastIndexOf('.'), t.lastIndexOf(','));
  let v;
  if (i >= 0) {
    const ch = t[i], after = t.length - i - 1, count = t.split(ch).length - 1;
    if (count===1 && after>0 && after<=2) v = parseFloat(t.slice(0,i).replace(/[.,]/g,'') + '.' + t.slice(i+1));
    else v = parseFloat(t.replace(/[.,]/g,''));
  } else v = parseFloat(t);
  if (!isFinite(v)) return 0;
  return neg ? -v : v;
}

/* ================= months ================= */
function templateMonth(){
  const groups = {};
  for (const g of GROUPS) groups[g.kind] = TEMPLATE[g.kind].map(n => ({id:uid(), name:n, planned:0, cur:base()}));
  return {groups, tx:[], portfolio:null};
}
function normMonth(m){
  m.groups = m.groups || {}; for (const g of GROUPS) m.groups[g.kind] = m.groups[g.kind] || [];
  m.tx = Array.isArray(m.tx) ? m.tx : [];
  return m;
}
function getMonth(k, create){
  if (S.months[k]) return S.months[k];
  if (S._draft && S._draft.k===k) { if (create) { S.months[k]=S._draft.m; delete S.months[k]._copiedFrom; S._draft=null; return S.months[k]; } return S._draft.m; }
  const earlier = Object.keys(S.months).filter(x => x < k).sort().pop();
  let m;
  if (earlier) {
    const src = S.months[earlier], groups = {};
    for (const g of GROUPS) groups[g.kind] = (src.groups[g.kind]||[]).map(it => ({id:it.id, name:it.name, planned:it.planned||0, cur:it.cur||'COP'}));
    m = {groups, tx:[], portfolio:null, _copiedFrom:earlier};
    if (src.trm) m.trm = src.trm;
  } else m = templateMonth();
  if (create) { delete m._copiedFrom; S.months[k] = m; S._draft=null; }
  else S._draft = {k, m};   // keep the same unsaved copy (stable ids) until something is saved
  return m;
}
const itemCur = it => it.cur || 'COP';
function itemsOf(m){ const out=[]; for (const g of GROUPS) for (const it of (m.groups[g.kind]||[])) out.push({...it, kind:g.kind}); return out; }
function findItem(m,id){ for (const g of GROUPS){ const it=(m.groups[g.kind]||[]).find(i=>i.id===id); if (it) return {it, kind:g.kind}; } return null; }
function actualOf(m, it, trm){ let s=0; for (const t of m.tx) if (t.itemId===it.id) s += conv(t.amount, t.cur||itemCur(it), itemCur(it), trm); return s; }
function totals(m, k){
  const trm = trmOf(k), b = base(), t = {income:[0,0], fixed:[0,0], variable:[0,0], invest:[0,0]};
  for (const g of GROUPS) for (const it of (m.groups[g.kind]||[])) {
    t[g.kind][0] += conv(it.planned, itemCur(it), b, trm);
    t[g.kind][1] += conv(actualOf(m,it,trm), itemCur(it), b, trm);
  }
  return t;
}
const NEED_RE = /arriendo|hipoteca|servicio|internet|celular|transporte|salud|seguro|deuda|tarjeta|mercado|imprevist|cr[eé]dito|educaci|colegio|universidad/i;
const SAVE_RE = /fondo|ahorro|emergencia|inversi|pensi[oó]n/i;
function bucketOf(it, kind){
  if (it.bucket && BUCKET[it.bucket]) return it.bucket;
  if (kind==='invest' || SAVE_RE.test(it.name||'')) return 's';
  if (kind==='fixed') return 'n';
  return NEED_RE.test(it.name||'') ? 'n' : 'g';
}
function bucketTotals(m, k){
  const trm=trmOf(k), b=base(), t={n:[0,0], g:[0,0], s:[0,0]};
  for (const g of GROUPS){ if (g.kind==='income') continue;
    for (const it of (m.groups[g.kind]||[])){ const bk=bucketOf(it,g.kind);
      t[bk][0]+=conv(it.planned, itemCur(it), b, trm); t[bk][1]+=conv(actualOf(m,it,trm), itemCur(it), b, trm); } }
  return t;
}
const activeRule = () => { const r=S.settings.rule||defaultRule(); const o=(r.opts||{})[r.active]||RULES[r.active]||RULES.balanced; return {key:r.active, name:(RULES[r.active]||RULES.balanced).name, n:+o.n||0, g:+o.g||0, s:+o.s||0}; };
const usesUSD = m => itemsOf(m).some(i=>itemCur(i)!==base()) || m.tx.some(t=>t.cur && t.cur!==base());

/* ================= goal math (EA -> monthly compounding) ================= */
const goal = () => S.settings.goal;
const mrate = () => Math.pow(1 + (Number(goal().rate)||0)/100, 1/12) - 1;
const startIdx = () => idxOf(goal().start || todayKey);
const endIdx = () => startIdx() + Math.max(1, Math.round((Number(goal().years)||1)*12));
function contribOf(k){
  const m=S.months[k]; if(!m) return 0; const trm=trmOf(k); let s=0;
  for (const it of (m.groups.invest||[])) s += conv(actualOf(m,it,trm), itemCur(it), gcur(), trm);
  return s;
}
function valueAt(i){
  const r=mrate(); let v=Number(goal().initial)||0;
  for (let j=startIdx(); j<=i; j++){
    v = v*(1+r) + contribOf(keyOf(j));
    const m = S.months[keyOf(j)];
    if (m && m.portfolio!=null && m.portfolio!=='') v = Number(m.portfolio);
  }
  return v;
}
const valueBefore = i => i<=startIdx() ? (Number(goal().initial)||0) : valueAt(i-1);
function pmt(pv, target, n){
  const r=mrate(); if (n<=0) return Math.max(0,target-pv);
  if (r===0) return Math.max(0,(target-pv)/n);
  const g=Math.pow(1+r,n); return Math.max(0,(target - pv*g) * r/(g-1));
}
function fv(pv, p, n){ const r=mrate(); if (r===0) return pv+p*n; const g=Math.pow(1+r,n); return pv*g + p*(g-1)/r; }
function monthsToReach(pv, p, target){
  const r=mrate(); if (pv>=target) return 0;
  if (r===0) return p>0 ? Math.ceil((target-pv)/p) : Infinity;
  const den = pv + p/r; if (den<=0) return Infinity;
  const n = Math.log((target + p/r)/den)/Math.log(1+r); return isFinite(n) && n>=0 ? Math.ceil(n) : Infinity;
}
function avgContrib(upto){
  const ks = Object.keys(S.months).filter(k => idxOf(k)>=startIdx() && idxOf(k)<=upto);
  if (!ks.length) return null;
  return ks.reduce((s,k)=>s+contribOf(k),0)/ks.length;
}
const fmtMonths = n => { if (!isFinite(n)) return 'No llegas'; const y=Math.floor(n/12), m=n%12; return [y?`${y} año${y>1?'s':''}`:'', m?`${m} mes${m>1?'es':''}`:''].filter(Boolean).join(' y ') || 'Ya llegaste'; };

const DIAG = {reason:'', lastErr:'', lastSaved:null, localOk:true};
const errCode = e => (e && (e.code || e.name)) ? String(e.code || e.name) + (e.message ? ': ' + e.message : '') : String(e);
function setSave(t, err){ saveText=t; saveErr=!!err; const el=document.getElementById('saveSt'); if (el){ el.textContent=t; el.classList.toggle('err',saveErr); } }
function persistLocal(){ localStorage.setItem(LS, JSON.stringify({settings:S.settings, months:S.months})); }
function docData(path){
  if (path==='budget/settings') return S.settings;
  const m = S.months[path.slice(7)]; if (!m) return null;
  const c = JSON.parse(JSON.stringify(m)); delete c._copiedFrom; return c;
}
function save(path){
  const w = W[path] || (W[path]={ver:0,saved:0,fails:0});
  w.ver++; dirty.add(path); clearTimeout(w.timer);
  setSave('Guardando…');
  w.timer = setTimeout(() => flush(path), 400);
}
async function flush(path){
  const w=W[path]; if (!w || w.inflight) return; clearTimeout(w.timer); w.inflight=true; const v=w.ver; let ok=true;
  try {
    const data = docData(path);
    if (S.mode==='db') { if (data) await db.doc(path).set(JSON.parse(JSON.stringify(data))); else await db.doc(path).delete(); }
    else persistLocal();
    w.saved=v; w.fails=0; DIAG.lastSaved=new Date(); DIAG.lastErr='';
  } catch(e){ ok=false; w.fails++; DIAG.lastErr=errCode(e); setSave('No se pudo guardar · reintentando', true); if (w.fails===1) render(); }
  w.inflight=false;
  if (!ok) { w.timer=setTimeout(()=>flush(path), Math.min(30000, 1500*2**w.fails)); return; }
  if (w.ver!==w.saved) return flush(path);
  dirty.delete(path);
  if (!dirty.size) setSave(S.mode==='db' ? 'Guardado' : 'Guardado en el teléfono');
}
const flushAll = () => { for (const p of [...dirty]) flush(p); };
const saveSettings = () => save('budget/settings');
const saveMonth = k => { if (S._draft && S._draft.k!==k) S._draft=null; getMonth(k,true); save('months/'+k); };

function mergeSettings(d){
  const def=defaultSettings();
  d = d || {};
  const rule = {...def.rule, ...(d.rule||{}), opts:{...def.rule.opts, ...((d.rule||{}).opts||{})}};
  if (!RULES[rule.active]) rule.active='balanced';
  return {...def, ...d, goal:{...def.goal, ...(d.goal||{})}, trmHist:{...(d.trmHist||{})}, rule};
}
function loadLocal(reason){

  try{ const d=JSON.parse(localStorage.getItem(LS)||'null'); if (d){ S.settings=mergeSettings(d.settings); S.months={}; for (const k in (d.months||{})) S.months[k]=normMonth(d.months[k]); } }catch(e){}
  setSave('Guardado en este teléfono'); render();
}
async function getJSON(url){
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(), 7000);
  try { const r=await fetch(url,{signal:ctl.signal, cache:'no-store'}); if (!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const TRM_SOURCES = [
  async () => { const d=await getJSON('https://www.datos.gov.co/resource/32sa-8pi3.json?$limit=1&$order=vigenciadesde%20DESC');
    return {v:parseFloat(d[0].valor), date:String(d[0].vigenciadesde||'').slice(0,10), src:'TRM oficial · Superfinanciera'}; },
  async () => { const d=await getJSON('https://open.er-api.com/v6/latest/USD');
    return {v:Number(d.rates.COP), date:new Date((d.time_last_update_unix||0)*1000).toISOString().slice(0,10), src:'Tasa de mercado · ExchangeRate-API'}; },
  async () => { const d=await getJSON('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');
    return {v:Number(d.usd.cop), date:String(d.date||''), src:'Tasa de mercado · currency-api'}; }
];
let trmBusy=false;
async function fetchTRM(force){
  const st=S.settings; if (st.trmMode!=='auto' || trmBusy) return;
  const a=st.trmAuto; if (!force && a && a.at && (Date.now()-new Date(a.at).getTime()) < 6*3600e3 && a.at.slice(0,10)===todayDate) return;
  if (navigator.onLine===false) return;
  trmBusy=true; if (force) render();
  let got=null, lastErr='';
  for (const src of TRM_SOURCES){ try { const r=await src(); if (r && r.v>1000 && r.v<20000){ got=r; break; } } catch(e){ lastErr=errCode(e); } }
  trmBusy=false;
  if (got){
    st.trmAuto={v:Math.round(got.v*100)/100, date:got.date, src:got.src, at:new Date().toISOString()};
    st.trm=st.trmAuto.v; st.trmHist={...(st.trmHist||{}), [todayKey]:st.trmAuto.v};
    DIAG.trmErr=''; saveSettings(); if (force) toast('TRM actualizada');
  } else { DIAG.trmErr = lastErr || 'sin respuesta'; if (force) toast('No pude traer la TRM. Revisa tu internet.'); }
  render();
}
function loadDevice(){
  loadLocal('');
  if (!DIAG.localOk) { DIAG.reason='Este navegador no permite guardar datos (¿modo privado?).'; render(); return; }
  S.mode='device'; setSave('Guardado en el teléfono');
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
  render();
  fetchTRM(false);
}
async function boot(){
  if (!window.claude || !window.claude.use) return loadDevice();
  try { db = await window.claude.use('db'); } catch(e){ db=null; DIAG.lastErr=errCode(e); }
  if (!db) return loadLocal('Claude no dio acceso a tu cuenta en este navegador (normalmente porque no hay sesión iniciada aquí).');
  S.mode='db'; let gotS=false, gotM=false, first=true;
  const changed = () => { if (gotS && gotM){ if (first){ first=false; if(!dirty.size) setSave('Guardado'); } render(); } };
  db.doc('budget/settings').onSnapshot(s => {
    if (dirty.has('budget/settings')) { gotS=true; return; }
    const next = s.exists ? mergeSettings(s.data()) : S.settings;
    const same = JSON.stringify(next)===JSON.stringify(S.settings);
    S.settings = next; gotS=true; if (!same || first) changed();
  }, e => { DIAG.lastErr=errCode(e); if (first) loadLocal('No se pudieron leer tus datos de la cuenta.'); else { setSave('Sin conexión', true); render(); } });
  db.collection('months').onSnapshot(q => {
    let diff=false; const seen=new Set();
    for (const d of q.docs){
      seen.add(d.id); if (dirty.has('months/'+d.id)) continue;
      const nd = normMonth(d.data()||{});
      if (JSON.stringify(nd)!==JSON.stringify(S.months[d.id])) { S.months[d.id]=nd; diff=true; }
    }
    for (const k of Object.keys(S.months)) if (!seen.has(k) && !dirty.has('months/'+k)) { delete S.months[k]; diff=true; }
    if (diff && !S.sheet) S._draft=null;
    gotM=true; if (diff || first) changed();
  }, e => { DIAG.lastErr=errCode(e); if (first) loadLocal('No se pudieron leer tus datos de la cuenta.'); else { setSave('Sin conexión', true); render(); } });
}

  const r=activeRule(), inc=t.income[0]||t.income[1];
  const head=`<div class="sech"><span>Tu plan de ahorro</span><b>${esc(r.name)} ${r.n}/${r.g}/${r.s}</b></div>`;
  if (inc<=0) return `<div class="sec">${head}<button class="note" data-act="rule" style="text-align:left;width:100%">Pon en <b>Ingresos</b> cuánto esperas ganar este mes y aquí te digo cuánto puedes gastar en necesidades y gustos, y cuánto ahorrar para tu meta. <span style="color:var(--blue)">Ver planes</span></button></div>`;
  const bt=bucketTotals(m,k), lim={n:inc*r.n/100, g:inc*r.g/100, s:inc*r.s/100}, b=base(), trm=trmOf(k);
  const row = key => {
    const [pl,ac]=bt[key], L=lim[key];
    if (key==='s'){
      const pct=L?Math.min(100,ac/L*100):0;
      return `<div class="cell" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><span>${BUCKET.s}</span><span class="n" style="font-weight:600">mínimo ${money(L)}</span></div>
        <div class="pbar"><i style="width:${pct.toFixed(1)}%;background:var(--green)"></i></div>
        <div class="s" style="margin-top:6px">Planeaste ${money(pl)} · aportaste ${money(ac)}${pl<L-0.5?` · <span class="orange">planea ${money(L-pl)} más</span>`:' ✓'}</div></div>`;
    }
    const over=pl>L+0.5, pct=L?Math.min(100,ac/L*100):0, color=ac>L?'var(--red)':pct>85?'var(--orange)':'var(--blue)';
    return `<div class="cell" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><span>${BUCKET[key]}</span><span class="n" style="font-weight:600">hasta ${money(L)}</span></div>
      <div class="pbar"><i style="width:${pct.toFixed(1)}%;background:${color}"></i></div>
      <div class="s" style="margin-top:6px">Planeaste <span class="${over?'red':''}">${money(pl)}</span> · gastaste <span class="${ac>L?'red':''}">${money(ac)}</span>${ac<=L?` · te quedan ${money(L-ac)}`:''}</div></div>`;
  };
  // tie the plan to the investment goal
  const gl=goal(), si=idxOf(k), need=pmt(valueBefore(si), gl.target, endIdx()-si), needB=conv(need,gcur(),b,trm);
  let tie;
  if (lim.s >= needB-0.5) tie=`<b class="green">Tu plan alcanza para tu meta.</b> Tu meta pide ${money(needB)} al mes y tu plan deja ${money(lim.s)} para ahorrar.${lim.s-needB>0.5?` Los ${money(lim.s-needB)} restantes van a tu fondo de emergencia.`:''}`;
  else {
    const n=monthsToReach(valueBefore(si), conv(lim.s,b,gcur(),trm), gl.target);
    tie=`<b class="orange">Tu plan no alcanza para tu meta a tiempo.</b> Tu meta pide ${money(needB)} al mes (${Math.ceil(needB/inc*100)} % de tus ingresos) y tu plan ahorra ${money(lim.s)}. ${isFinite(n)?`Con ese ahorro llegarías en ${fmtMonths(n).toLowerCase()}.`:''} Sube tu % de ahorro${r.key!=='fast'?', elige el plan Acelerado':''} o amplía el plazo en Inversión.`;
  }
  const ef=bt.n[0]||lim.n;
  return `<div class="sec">${head}<div class="list">
      ${row('n')}${row('g')}${row('s')}
      <button class="cell blue" data-act="rule"><div class="main">Cambiar o ajustar mi plan</div><span class="arrow">${IC.chev}</span></button></div>
    <div class="note" style="margin-top:10px;font-size:14px;color:var(--label)">${tie}<div class="muted" style="margin-top:8px">Fondo de emergencia recomendado: ${money(ef*3)} a ${money(ef*6)} (3 a 6 meses de necesidades). Llénalo antes de invertir más allá de tu meta.</div></div></div>`;
}
function groupHtml(m,k,g,t){
  const trm=trmOf(k), items=m.groups[g.kind]||[];
  const rows = items.map(it => {
    const c=itemCur(it), ac=actualOf(m,it,trm), pl=Number(it.planned)||0, rem=pl-ac;
    const pct = pl ? Math.min(100, ac/pl*100) : (ac?100:0);
    let sub, cls='';
    if (g.kind==='income'){
      if (!pl && !ac) sub='Toca para poner cuánto esperas';
      else if (!ac) sub='Aún no te llega · toca para registrarlo';
      else if (rem>0) sub=`Te llegó ${money(ac,c)} · faltan ${money(rem,c)}`;
      else { sub='Te llegó completo ✓'; cls='green'; }
    }
    else if (g.kind==='invest') sub = rem>0 ? `Falta aportar ${money(rem,c)}` : (pl ? `Aportado ${money(ac,c)} ✓` : (ac?`Aportado ${money(ac,c)}`:'Toca para planear'));
    else if (rem<0){ sub = `Te pasaste ${money(-rem,c)}`; cls='red'; }
    else sub = pl ? `Te quedan ${money(rem,c)}` : (ac?`Gastado ${money(ac,c)}`:'Toca para planear');
    const color = g.kind==='income' ? 'var(--green)' : g.kind==='invest' ? 'var(--orange)' : rem<0 ? 'var(--red)' : pct>85 ? 'var(--orange)' : 'var(--blue)';
    return `<button class="cell" data-act="item" data-g="${g.kind}" data-id="${esc(it.id)}">
      <div class="main"><div class="t">${esc(it.name)}${c!==base()?`<span class="badge">${c}</span>`:''}</div>
        <div class="s ${cls}">${sub}</div><div class="pbar"><i style="width:${pct.toFixed(1)}%;background:${color}"></i></div></div>
      <div class="v">${money(pl,c)}<small>${g.kind==='income'?'esperado':g.kind==='invest'?'planeado':'presupuesto'}</small></div><span class="arrow">${IC.chev}</span></button>`;
  }).join('');
  const [pl,ac]=t[g.kind];
  const label = g.kind==='income' ? `te llegó ${money(ac)} de ${money(pl)}` : g.kind==='invest' ? `${money(ac)} de ${money(pl)}` : `gastado ${money(ac)} de ${money(pl)}`;
  return `<div class="sec"><div class="sech"><span>${g.name}</span><b class="n">${label}</b></div>
    <div class="list">${rows}<button class="cell blue" data-act="newItem" data-g="${g.kind}">${IC.plus.replace('<svg','<svg style="width:18px;height:18px"')}<span>${g.kind==='income'?'Añadir fuente de ingreso':'Añadir línea'}</span></button></div>
    ${g.kind==='income'?'<div class="foot">El número de la derecha es lo que <b>esperas</b> ganar en el mes. Cuando te paguen, toca la línea y registra lo que te llegó.</div>':''}</div>`;
}

function viewTx(){
  const k=S.cur, m=getMonth(k,false), trm=trmOf(k);
  const f=S.txFilter;
  const list=[...m.tx].filter(x=>!f || x.itemId===f).sort((a,b)=> (b.date||'').localeCompare(a.date||'') || 0);
  let lastDay='', html='';
  for (const x of list){
    const fi=findItem(m,x.itemId), it=fi&&fi.it, kind=fi&&fi.kind, c=x.cur||(it?itemCur(it):'COP');
    if (x.date!==lastDay){ if (lastDay) html+='</div></div>'; lastDay=x.date; html+=`<div class="sec" style="margin-top:20px"><div class="sech"><span>${esc(dayLabel(x.date||k+'-01'))}</span></div><div class="list">`; }

      <div class="v ${color}" style="font-weight:600">${sign} ${money(x.amount,c)}${c!==base()?`<small>≈ ${money(conv(x.amount,c,base(),trm))}</small>`:''}</div><span class="arrow">${IC.chev}</span></button>`;

function itemOptions(m, selId){

}

function viewGoal(){
  const gl=goal(), gc=gcur(), si=Math.max(idxOf(S.cur), startIdx()), ei=endIdx();
  const vPrev=valueBefore(si), v=valueAt(si), remainingM=Math.max(0,ei-si);
  const need=pmt(vPrev, gl.target, remainingM), needStart=pmt(Number(gl.initial)||0, gl.target, ei-startIdx());
  const avg=avgContrib(idxOf(S.cur)), pace = avg==null ? null : monthsToReach(v, avg, gl.target);
  const pct=Math.max(0,Math.min(100, v/gl.target*100));
  const timePct=Math.min(100, Math.max(0,(idxOf(S.cur)-startIdx()+1)/(ei-startIdx())*100));
  const totalIn = Math.min(gl.target, vPrev + need*remainingM), interest = Math.max(0, gl.target - totalIn);
  const put=contribOf(S.cur), m=S.months[S.cur];
  const status = pct>=timePct-2 ? ['ok','Vas a tiempo'] : pct>=timePct*0.75 ? ['warn','Un poco atrasado'] : ['bad','Vas atrasado'];
  const R=40, C=2*Math.PI*R;
  return `
  <div class="sum">
    <div class="ring">
      <svg viewBox="0 0 92 92" role="img" aria-label="${pct.toFixed(0)} % de la meta"><circle cx="46" cy="46" r="${R}" fill="none" stroke="var(--fill)" stroke-width="10"/>
        <circle cx="46" cy="46" r="${R}" fill="none" stroke="var(--orange)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C*pct/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 46 46)"/>
        <text x="46" y="51" text-anchor="middle" font-size="16" font-weight="700" fill="var(--label)" font-family="var(--font)">${pct<10?pct.toFixed(1):pct.toFixed(0)}%</text></svg>
      <div style="min-width:0"><div class="eyebrow">${esc(gl.name)}</div><div class="big" style="font-size:30px">${money(v,gc)}</div>

    </div>
    <div class="meter"><i style="width:${pct}%"></i><b style="left:${timePct}%"></b></div>
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:8px"><span class="pill ${status[0]}" style="margin:0">${status[1]}</span><span class="muted" style="font-size:13px">${timePct.toFixed(0)} % del plazo · meta ${esc(monthShort(keyOf(ei-1)))}</span></div>
  </div>

  <div class="sec"><div class="sech"><span>Este mes</span></div><div class="list">
    <div class="cell"><div class="main">Aporte necesario</div><div class="v" style="font-weight:600">${money(need,gc)}</div></div>
    <div class="cell"><div class="main">Aportaste</div><div class="v orange" style="font-weight:600">${money(put,gc)}</div></div>
    <div class="cell"><div class="main">${put>=need?'Superaste por':'Te falta'}</div><div class="v ${put>=need?'green':'red'}" style="font-weight:600">${money(Math.abs(need-put),gc)}</div></div>
  </div><div class="foot">Los aportes salen de los movimientos que anotes en el grupo Inversión.</div></div>

  <div class="sec"><div class="sech"><span>Tu plan</span></div><div class="list">
    <div class="cell"><div class="main">Aporte mensual desde el inicio</div><div class="v">${money(needStart,gc)}</div></div>
    <div class="cell"><div class="main">Meses restantes</div><div class="v">${remainingM}</div></div>
    <div class="cell"><div class="main">Pondrás de tu bolsillo</div><div class="v">${money(totalIn,gc)}</div></div>
    <div class="cell"><div class="main">Lo pone el interés compuesto</div><div class="v green">${money(interest,gc)}</div></div>
  </div></div>

  <div class="sec"><div class="sech"><span>A tu ritmo actual</span></div><div class="list">
    ${avg==null ? `<p class="empty">Cuando anotes tu primer aporte te diré cuándo llegas a la meta a ese ritmo.</p>` : `
    <div class="cell"><div class="main">Aporte promedio</div><div class="v">${money(avg,gc)}</div></div>

  </div>${avg!=null?`<div class="foot">${isFinite(pace)&&si+pace<=ei?'A este ritmo llegas a tiempo.':'A este ritmo no llegas en el plazo. Sube el aporte o amplía los años.'}</div>`:''}</div>

  <div class="sec"><div class="sech"><span>Proyección</span></div><div class="chart">${chartSvg(si,vPrev,need,v,avg)}
    <div class="legend"><span><i style="background:var(--orange)"></i>Tu avance</span><span><i style="background:var(--blue)"></i>Plan a tiempo</span><span><i style="background:var(--label2)"></i>A tu ritmo</span></div></div></div>

  <div class="sec"><div class="sech"><span>Ajusta tu meta</span></div><div class="list">

      <input id="g-years" type="range" min="1" max="40" step="1" value="${gl.years}" data-g="years" style="margin-top:10px"></div>
  </div><div class="foot">Equivale a ${(mrate()*100).toFixed(3).replace('.',',')} % mensual compuesto.</div></div>

  <div class="sec"><div class="sech"><span>¿Y si cambio el plazo?</span></div><div class="list">
    ${[2,3,5,7,10,15,20].map(y=>`<div class="cell"><div class="main">Llegar en ${y} años</div><div class="v">${money(pmt(v,gl.target,y*12),gc)}<small>al mes</small></div></div>`).join('')}
  </div><div class="foot">Aporte mensual necesario desde hoy, partiendo de ${money(v,gc)}.</div></div>

  <div class="sec"><div class="sech"><span>Saldo real (opcional)</span></div><div class="list">
    <div class="cell"><label for="g-port">Fin de ${esc(monthOnly(S.cur))}</label><input id="g-port" inputmode="decimal" value="${m&&m.portfolio!=null&&m.portfolio!==''?plain(m.portfolio,gc):''}" placeholder="${plain(v,gc)||'0'}" data-g="portfolio" autocomplete="off"><span class="muted">${gc}</span></div>
  </div><div class="foot">Si tu fondo o broker muestra un saldo distinto al estimado, escríbelo y lo uso desde este mes.</div></div>`;
}
function chartSvg(si, vPrev, need, v, avg){
  const gl=goal(), s0=startIdx(), ei=endIdx(), W=360, H=210, L=44, R=10, T=12, B=24;
  const hist=[[s0-1, Number(gl.initial)||0]]; for (let i=s0;i<=Math.min(si,ei-1);i++) hist.push([i, valueAt(i)]);
  const plan=[[si-1,vPrev]]; for (let k=1;k<=ei-si;k++) plan.push([si-1+k, fv(vPrev,need,k)]);
  const pace=[]; if (avg!=null){ pace.push([si,v]); for (let k=1;k<=ei-si-1;k++) pace.push([si+k, fv(v,avg,k)]); }
  const maxV = Math.max(gl.target, ...pace.map(p=>p[1]), ...hist.map(p=>p[1]))*1.1 || 1;
  const x=i=>L+(i-(s0-1))/(ei-(s0-1))*(W-L-R), y=val=>T+(1-Math.max(0,val)/maxV)*(H-T-B);
  const path=pts=>pts.map((p,j)=>`${j?'L':'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  const raw=maxV/4, p10=Math.pow(10,Math.floor(Math.log10(raw))), step=[1,2,2.5,5,10].map(q=>q*p10).find(s=>s>=raw);
  let grid=''; for (let val=0; val<=maxV; val+=step) grid+=`<line x1="${L}" x2="${W-R}" y1="${y(val).toFixed(1)}" y2="${y(val).toFixed(1)}" stroke="var(--sep)"/><text x="${L-6}" y="${(y(val)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--label2)" font-family="var(--font)">${compact(val)}</text>`;
  const yrs=Number(gl.years)||1, every = yrs>20?10:yrs>10?5:yrs>5?2:1;
  let xt=''; for (let k=0;k<=yrs;k+=every){ const i=s0-1+k*12; xt+=`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="${k===0?'start':k>=yrs?'end':'middle'}" font-size="10" fill="var(--label2)" font-family="var(--font)">${keyOf(i+1).slice(0,4)}</text>`; }
  const last=hist[hist.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyección de tu inversión hacia la meta">
    ${grid}${xt}
    <line x1="${L}" x2="${W-R}" y1="${y(gl.target).toFixed(1)}" y2="${y(gl.target).toFixed(1)}" stroke="var(--label)" stroke-opacity=".45" stroke-dasharray="4 4"/>
    <text x="${L+4}" y="${(y(gl.target)-5).toFixed(1)}" font-size="10" font-weight="600" fill="var(--label)" font-family="var(--font)">Meta ${compact(gl.target)}</text>
    ${pace.length>1?`<path d="${path(pace)}" fill="none" stroke="var(--label2)" stroke-width="1.6" stroke-dasharray="2 3"/>`:''}
    <path d="${path(plan)}" fill="none" stroke="var(--blue)" stroke-width="2"/>
    <path d="${path(hist)}L${x(last[0]).toFixed(1)},${y(0).toFixed(1)}L${x(s0-1).toFixed(1)},${y(0).toFixed(1)}Z" fill="var(--orange)" opacity=".16"/>
    <path d="${path(hist)}" fill="none" stroke="var(--orange)" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="${x(last[0]).toFixed(1)}" cy="${y(last[1]).toFixed(1)}" r="4" fill="var(--orange)" stroke="var(--card)" stroke-width="2"/>
  </svg>`;
}

        <div class="cell"><label for="r-n">Necesidades</label><input id="r-n" inputmode="decimal" value="${esc(d.n)}" data-draft="n" autocomplete="off"><span class="muted">%</span></div>

const amtW = v => `${Math.max(1, String(v||'').length)*0.62 + 0.3}em`;
const defDate = () => S.cur===todayKey ? todayDate : `${S.cur}-01`;
function openTx(id, itemId){
  const m=getMonth(S.cur,false);
  if (id){
    const x=m.tx.find(t=>t.id===id); if (!x) return;
    const fi=findItem(m,x.itemId);
    S.sheet={type:'tx', id, anim:!S.sheet, draft:{amt:plain(x.amount, x.cur||'COP'), cur:x.cur||(fi?itemCur(fi.it):'COP'), itemId:x.itemId, date:x.date||defDate(), note:x.note||''}};
  } else {
    const items=itemsOf(m);
    const pick = itemId || (items.some(i=>i.id===S.lastItem) ? S.lastItem : (items.find(i=>i.kind==='variable')||items[0]||{}).id);
    const fi = pick ? findItem(m,pick) : null;
    S.sheet={type:'tx', anim:!S.sheet, draft:{amt:'', cur: fi?itemCur(fi.it):base(), itemId:pick||'', date:defDate(), note:''}};
  }
  S._focus = id ? null : 's-amt';
}
function openItem(g, id){
  const m=getMonth(S.cur,false);
  if (id){ const fi=findItem(m,id); if (!fi) return; S.sheet={type:'item', g:fi.kind, id, anim:true, draft:{name:fi.it.name, planned:plain(fi.it.planned,itemCur(fi.it)), cur:itemCur(fi.it), bucket:bucketOf(fi.it,fi.kind)}}; }
  else { S.sheet={type:'item', g, anim:true, draft:{name:'', planned:'', cur:base(), bucket:g==='invest'?'s':g==='fixed'?'n':'g'}}; S._focus='s-name'; }
}
function sheetSave(){
  const sh=S.sheet; if (!sh) return; const d=sh.draft;
  if (sh.type==='tx'){
    const amount=parseNum(d.amt);
    if (!(amount>0)){ sh.err='Escribe un monto mayor que cero'; S._focus='s-amt'; return render(); }
    const src=getMonth(S.cur,false), fi=findItem(src,d.itemId);
    if (!fi){ sh.err='Elige una categoría'; return render(); }
    const date = /^\d{4}-\d{2}-\d{2}$/.test(d.date) ? d.date : defDate();
    const k = date.slice(0,7);
    if (sh.id){ const cm=getMonth(S.cur,true); cm.tx=cm.tx.filter(t=>t.id!==sh.id); saveMonth(S.cur); }
    const m=getMonth(k,true);
    if (!findItem(m,d.itemId)) m.groups[fi.kind].push({id:fi.it.id, name:fi.it.name, planned:0, cur:itemCur(fi.it)});
    m.tx.push({id:sh.id||uid(), itemId:d.itemId, amount, cur:d.cur, date, note:(d.note||'').trim()});
    S.lastItem=d.itemId; saveMonth(k);
    S.sheet=null;
    toast(k===S.cur ? (sh.id?'Movimiento actualizado':'Movimiento anotado') : `Anotado en ${monthName(k)}`);
  } else if (sh.type==='item'){
    const name=(d.name||'').trim(); if (!name){ sh.err='Ponle un nombre a la línea'; S._focus='s-name'; return render(); }
    const m=getMonth(S.cur,true);
    const bk = sh.g==='income' ? undefined : d.bucket;
    if (sh.id){ const fi=findItem(m,sh.id); if (fi){ fi.it.name=name; fi.it.planned=parseNum(d.planned); fi.it.cur=d.cur; if (bk) fi.it.bucket=bk; } }
    else { const it={id:uid(), name, planned:parseNum(d.planned), cur:d.cur}; if (bk) it.bucket=bk; m.groups[sh.g].push(it); }
    saveMonth(S.cur); S.sheet=null; toast(sh.id?'Línea guardada':'Línea añadida');
  } else if (sh.type==='rule'){
    const n=parseNum(d.n), g=parseNum(d.g), sv=parseNum(d.s);
    if (n<0||g<0||sv<0 || Math.abs(n+g+sv-100)>0.01){ sh.err='Los tres porcentajes deben sumar 100 %'; return render(); }
    d.opts[d.active]={n,g,s:sv};
    S.settings.rule={active:d.active, opts:d.opts}; saveSettings(); S.sheet=null; toast(`Plan ${RULES[d.active].name} activado`);
  } else if (sh.type==='trm'){
    const m=getMonth(S.cur,true), v=parseNum(d.trm);
    if (v>0) m.trm=v; else delete m.trm;
    saveMonth(S.cur); S.sheet=null; toast('TRM guardada');
  }
  render();
}

/* ================= backup ================= */
async function exportBackup(){
  const stamp=todayDate;
  S.settings.lastBackup=new Date().toISOString(); saveSettings();
  const json=JSON.stringify({app:'mi-presupuesto', version:1, exported:S.settings.lastBackup, settings:S.settings, months:S.months}, null, 1);
  const name=`mi-presupuesto-${stamp}.json`;
  try {
    const file=new File([json], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:'Copia de Mi Presupuesto'}); toast('Copia lista'); render(); return; }
  } catch(e){ if (e && e.name==='AbortError') { render(); return; } }
  const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000); toast('Copia descargada'); render();
}
document.addEventListener('change', e => {
  if (e.target.id!=='c-import' || !e.target.files || !e.target.files[0]) return;
  const f=e.target.files[0]; const r=new FileReader();
  r.onload=()=>{ try { const d=JSON.parse(r.result); if (!d || typeof d!=='object' || !d.months || !d.settings) throw 0; S.importPending=d; } catch(err){ toast('Ese archivo no es una copia de Mi Presupuesto'); } render(); };
  r.readAsText(f);
});

/* ================= events ================= */
document.addEventListener('pointerdown', () => { pointerDown=true; }, true);
const release = () => { pointerDown=false; if (pendingRender) setTimeout(() => { if (pendingRender) render(); }, 0); };
document.addEventListener('pointerup', release, true);
document.addEventListener('pointercancel', release, true);

document.addEventListener('click', e => {
  const b=e.target.closest('[data-act]');
  if (!b || b.tagName==='INPUT' || b.tagName==='SELECT' || b.tagName==='TEXTAREA') return;
  const a=b.dataset.act;
  switch (a){
    case 'prev': case 'next': S.cur=keyOf(idxOf(S.cur)+(a==='prev'?-1:1)); S.txFilter=''; break;
    case 'today': S.cur=todayKey; S.txFilter=''; break;
    case 'tab': if (S.tab!==b.dataset.v){ S.tab=b.dataset.v; render(); window.scrollTo(0,0); return; } break;
    case 'goMonth': S.cur=b.dataset.v; S.tab='budget'; render(); window.scrollTo(0,0); return;
    case 'newTx': openTx(null); break;
    case 'editTx': openTx(b.dataset.id); break;
    case 'item': openItem(b.dataset.g, b.dataset.id); break;
    case 'newItem': openItem(b.dataset.g, null); break;
    case 'itemTx': { const id=S.sheet&&S.sheet.id; S.sheet=null; openTx(null,id); break; }
    case 'trm': { const m=S.months[S.cur]; S.sheet={type:'trm', anim:true, draft:{trm: m&&m.trm ? plain(m.trm,'COP') : ''}}; S._focus='s-trm'; break; }
    case 'sheetClose': S.sheet=null; break;
    case 'rule': { const r=S.settings.rule||defaultRule(), opts=JSON.parse(JSON.stringify(r.opts)), o=opts[r.active];
      S.sheet={type:'rule', anim:!S.sheet, draft:{active:r.active, opts, n:String(o.n), g:String(o.g), s:String(o.s)}}; break; }
    case 'ruleOpt': { const d=S.sheet.draft; d.opts[d.active]={n:parseNum(d.n),g:parseNum(d.g),s:parseNum(d.s)}; d.active=b.dataset.v; const o=d.opts[d.active]; d.n=String(o.n); d.g=String(o.g); d.s=String(o.s); S.sheet.err=null; break; }
    case 'ruleReset': { const d=S.sheet.draft, R=RULES[d.active]; d.n=String(R.n); d.g=String(R.g); d.s=String(R.s); S.sheet.err=null; break; }
    case 'trmRefresh': fetchTRM(true); return;
    case 'incomeFull': { const sh=S.sheet, m=getMonth(S.cur,true), fi=findItem(m,sh.id); if (!fi) break;
      const rest=(Number(fi.it.planned)||0)-actualOf(m,fi.it,trmOf(S.cur));
      if (rest>0){ m.tx.push({id:uid(), itemId:fi.it.id, amount:Math.round(rest*100)/100, cur:itemCur(fi.it), date:defDate(), note:'Pago completo'}); saveMonth(S.cur); toast('Ingreso registrado'); }
      S.sheet=null; break; }
    case 'reload': location.reload(); return;
    case 'export': exportBackup(); return;
    case 'importYes': { const d=S.importPending; S.importPending=null; S.settings=mergeSettings(d.settings); S.months={}; for (const k in (d.months||{})) S.months[k]=normMonth(d.months[k]); S._draft=null;
      try { persistLocal(); DIAG.lastSaved=new Date(); toast('Copia importada'); } catch(e){ DIAG.lastErr=errCode(e); toast('No se pudo guardar la copia'); } break; }
    case 'importNo': S.importPending=null; break;
    case 'sheetSave': return sheetSave();
    case 'txDelete': { const m=getMonth(S.cur,true); m.tx=m.tx.filter(t=>t.id!==S.sheet.id); saveMonth(S.cur); S.sheet=null; toast('Movimiento eliminado'); break; }
    case 'itemDeleteAsk': S.sheet.confirm=true; break;
    case 'itemDeleteNo': S.sheet.confirm=false; break;
    case 'itemDelete': { const m=getMonth(S.cur,true), sh=S.sheet; m.groups[sh.g]=m.groups[sh.g].filter(i=>i.id!==sh.id); m.tx=m.tx.filter(t=>t.itemId!==sh.id); saveMonth(S.cur); S.sheet=null; toast('Línea eliminada'); break; }
    case 'example': { const m=getMonth(S.cur,true); for (const g of GROUPS) for (const it of m.groups[g.kind]) if (EXAMPLE[it.name]!=null && itemCur(it)==='COP') it.planned=EXAMPLE[it.name]; saveMonth(S.cur); toast('Ejemplo cargado: cámbialo por tus números'); break; }
    case 'seg': {
      const {scope, field, v} = b.dataset;
      if (scope==='draft' && S.sheet){ S.sheet.draft[field]=v; S.sheet.curTouched=true; }
      else if (scope==='settings'){ S.settings[field]=v; saveSettings(); if (field==='trmMode' && v==='auto') { render(); fetchTRM(true); return; } }
      else if (scope==='goal' && field==='cur' && v!==gcur()){
        const g=S.settings.goal, from=gcur(), trm=Number(S.settings.trm)||4000;
        g.target=Math.round(conv(g.target,from,v,trm)*100)/100; g.initial=Math.round(conv(g.initial,from,v,trm)*100)/100; g.cur=v;
        for (const k in S.months){ const m=S.months[k]; if (m.portfolio!=null && m.portfolio!==''){ m.portfolio=Math.round(conv(m.portfolio,from,v,trmOf(k))*100)/100; save('months/'+k); } }
        saveSettings(); toast(`Meta convertida a ${v}`);
      }
      break;
    }
    default: return;
  }
  render();
});

document.addEventListener('input', e => {
  const el=e.target;
  if (el.dataset.draft && S.sheet){ S.sheet.draft[el.dataset.draft]=el.value; if (S.sheet.err){ S.sheet.err=null; const er=document.querySelector('.sheet .err'); if (er) er.remove(); } }
  if (el.id==='s-amt') el.style.width = amtW(el.value);
  if (el.id==='g-years'){ const yl=document.getElementById('g-yl'); if (yl) yl.textContent=el.value; }
});
document.addEventListener('change', e => {
  const el=e.target;
  if (el.dataset.draft==='itemId' && S.sheet){
    S.sheet.draft.itemId=el.value;
    if (!S.sheet.curTouched){ const fi=findItem(getMonth(S.cur,false),el.value); if (fi) S.sheet.draft.cur=itemCur(fi.it); }
    return scheduleRender();
  }
  if (el.dataset.draft && S.sheet && S.sheet.type==='rule') return scheduleRender();
  if (el.dataset.draft) return;
  if (el.dataset.g){
    const k=el.dataset.g, g=S.settings.goal;
    if (k==='portfolio'){ const m=getMonth(S.cur,true); m.portfolio = el.value.trim()==='' ? null : parseNum(el.value); saveMonth(S.cur); return scheduleRender(); }
    if (k==='name') g.name=el.value.trim()||'Mi meta de inversión';
    else if (k==='rate') g.rate=Math.max(0,parseNum(el.value));
    else if (k==='target') g.target=Math.max(1,parseNum(el.value)||1);
    else if (k==='initial') g.initial=Math.max(0,parseNum(el.value));
    else if (k==='start') g.start=/^\d{4}-\d{2}$/.test(el.value) ? el.value : todayKey;
    else if (k==='years') g.years=Math.max(1,Math.min(40,Number(el.value)||1));
    saveSettings(); return scheduleRender();
  }
  if (el.dataset.set){
    const k=el.dataset.set;
    if (k==='trm'){ const v=parseNum(el.value); if (v>0) S.settings.trm=v; }
    else if (k==='rules') S.settings.rules=el.value;
    saveSettings(); return scheduleRender();
  }
  if (el.dataset.act==='txFilter'){ S.txFilter=el.value; return scheduleRender(); }
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape' && S.sheet){ S.sheet=null; render(); return; }
  if (e.key==='Enter' && e.target.tagName==='INPUT'){
    if (S.sheet && e.target.closest('.sheet')){ e.preventDefault(); e.target.blur(); sheetSave(); }
    else e.target.blur();
  }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='hidden') flushAll(); else if (S.mode!=='loading') fetchTRM(false); });
if (window.matchMedia) try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch(e){}
window.addEventListener('pagehide', flushAll);

boot();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
