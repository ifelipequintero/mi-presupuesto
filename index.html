<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Presupuesto</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presupuesto">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: phone-first iOS app — large-title header, inset grouped lists, floating + button, bottom tab bar, bottom sheets for editing */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --sep:rgba(60,60,67,.16);
  --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32); --fill:rgba(118,118,128,.14);
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --on:#FFFFFF;
  --bar:rgba(249,249,249,.86); --shade:rgba(0,0,0,.32);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --sep:rgba(84,84,88,.55);
  --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3); --fill:rgba(118,118,128,.28);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --on:#FFFFFF;
  --bar:rgba(22,22,24,.86); --shade:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --sep:rgba(84,84,88,.55);
  --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3); --fill:rgba(118,118,128,.28);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --on:#FFFFFF;
  --bar:rgba(22,22,24,.86); --shade:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.3;letter-spacing:-.01em}
.n{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}

/* header */
.head{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:8px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.headrow{display:flex;align-items:center;gap:6px;min-height:28px}
.save{font-size:13px;color:var(--label2);margin-right:auto}
.save.err{color:var(--red)}
.chev{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;color:var(--blue);background:var(--fill)}
.chev svg{width:16px;height:16px}
.today{font-size:15px;color:var(--blue);padding:6px 8px}
.title{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0;text-transform:capitalize;line-height:1.15}
.eyebrow{font-size:13px;color:var(--label2);font-weight:600;text-transform:uppercase;letter-spacing:.02em}

/* sections and lists */
.sec{margin-top:26px}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 16px 7px;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.01em}
.sech b{font-weight:400;text-transform:none}
.foot{padding:7px 16px 0;font-size:13px;color:var(--label2);line-height:1.35}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:48px;position:relative;width:100%;text-align:left}
.cell + .cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
button.cell:active,.cell.tap:active{background:var(--fill)}
.cell .main{flex:1;min-width:0}
.cell .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .s{font-size:13px;color:var(--label2);margin-top:2px}
.cell .v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.cell .v small{display:block;font-size:13px;color:var(--label2)}
.cell .arrow{color:var(--label3);flex:none}
.cell .arrow svg{width:8px;height:13px;display:block}
.cell.blue{color:var(--blue)}
.cell input,.cell select{border:0;background:transparent;text-align:right;min-width:0;flex:1;padding:0;outline:none}
.cell input:focus{color:var(--blue)}
.cell label{white-space:nowrap}
.pbar{height:4px;border-radius:2px;background:var(--fill);margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:2px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--fill);color:var(--label2);vertical-align:2px;margin-left:6px}
.red{color:var(--red)} .green{color:var(--green)} .orange{color:var(--orange)} .muted{color:var(--label2)}

/* summary card */
.sum{background:var(--card);border-radius:16px;padding:18px 16px 14px;margin-top:8px}
.sum .big{font-size:40px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;margin-top:10px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.pill.warn{color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent)}
.pill.bad{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;padding-top:14px;border-top:.5px solid var(--sep)}
.stat{min-width:0}
.stat .l{font-size:12px;color:var(--label2)}
.stat .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.stat .s{font-size:11px;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.note{background:var(--card);border-radius:12px;padding:12px 16px;font-size:15px;color:var(--label2);line-height:1.4}
.note b{color:var(--label)}
.btnrow{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.btn{background:var(--blue);color:var(--on);border-radius:12px;padding:14px 18px;font-weight:600;font-size:17px;width:100%;text-align:center}
.btn:active{opacity:.7}
.btn.tint{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.btn.danger{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.btn.small{width:auto;padding:9px 14px;font-size:15px;border-radius:10px}

/* segmented control */
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px;flex:none}
.seg button{padding:5px 14px;border-radius:7px;font-size:14px;font-weight:500;color:var(--label)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
.seg.wide{display:grid;width:100%}

/* goal */
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:92px;height:92px;flex:none}
.meter{height:8px;background:var(--fill);border-radius:4px;position:relative;margin-top:14px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--orange)}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--label);opacity:.55}
.chart{background:var(--card);border-radius:12px;padding:12px 8px 8px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--label2);padding:6px 8px 2px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
input[type=range]{width:100%;accent-color:var(--blue)}
textarea{width:100%;min-height:120px;border:0;background:transparent;resize:vertical;outline:none;line-height:1.4}

/* fab + tab bar */
.fab{position:fixed;z-index:20;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px),calc(50vw - 260px + 18px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:28px;background:var(--blue);color:var(--on);display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--blue) 40%,transparent)}
.fab svg{width:24px;height:24px}
.fab:active{transform:scale(.94)}
.tabbar{position:fixed;z-index:20;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:10px;font-weight:500;color:var(--label2)}
.tabbar button svg{width:25px;height:25px}
.tabbar button[aria-selected="true"]{color:var(--blue)}

/* sheet */
.sheetroot{position:fixed;inset:0;z-index:40}
.backdrop{position:absolute;inset:0;background:var(--shade)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:calc(100% - 40px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:14px 14px 0 0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheethead{position:sticky;top:0;z-index:1;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 0 10px}
.sheethead::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;border-radius:3px;background:var(--label3);transform:translateX(-50%)}
.sheethead h2{font-size:17px;font-weight:600;margin:12px 0 0;text-align:center}
.sheethead button{color:var(--blue);font-size:17px;padding:12px 0 0;justify-self:start}
.sheethead button.r{justify-self:end;font-weight:600}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:14px 0 6px}
.amount span{font-size:30px;color:var(--label2);font-weight:600}
.amount input{font-size:44px;font-weight:700;border:0;background:transparent;min-width:1.2ch;max-width:calc(100% - 60px);text-align:left;padding:0;outline:none;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.err{color:var(--red);font-size:14px;text-align:center;padding:4px 0}
@media (prefers-reduced-motion:no-preference){
  .sheetroot.anim .sheet{animation:up .32s cubic-bezier(.2,.9,.25,1)}
  .sheetroot.anim .backdrop{animation:fade .25s ease}
  .pbar i,.meter i{transition:width .35s ease}
}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;z-index:50;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--card2);color:var(--label);padding:10px 16px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.18);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px 20px;text-align:center;color:var(--label2);font-size:15px;line-height:1.4}

/* ---------- v3: friendlier layout ---------- */
.big{font-size:42px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px;overflow-wrap:anywhere}
.hero{background:var(--card);border-radius:22px;padding:18px 16px 14px;margin-top:8px}
.hero .s,.card .s,.goalmini .s{font-size:14px;color:var(--label2);margin-top:4px;line-height:1.35}
.card{display:block;background:var(--card);border-radius:16px;padding:16px;width:100%;text-align:left}
.card.empty{text-align:center;color:var(--label2);padding:24px 18px}
.avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex:none;line-height:1}
.avatar.sm{width:32px;height:32px;font-size:17px;border-radius:9px}
.avatar.lg{width:72px;height:72px;font-size:38px;border-radius:20px}
.row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
.row1 .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row1 .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row1.s{font-size:13px;color:var(--label2);margin-top:6px}
.segbar{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;background:var(--fill);margin-top:14px}
.segbar i,.distbar i{display:block;height:100%;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;padding-top:14px;border-top:.5px solid var(--sep)}
button.stat{text-align:left;border-radius:10px;padding:2px}
button.stat:active{background:var(--fill)}
.avail{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:.5px solid var(--sep);font-size:15px;color:var(--label2)}
.avail b{color:var(--label);font-weight:600}
.banner{display:block;width:100%;text-align:left;border-radius:14px;padding:12px 14px;font-size:15px;margin-top:12px;line-height:1.4;background:var(--card);color:var(--label)}
.banner.warn{background:color-mix(in srgb,var(--orange) 14%,var(--card))}
.banner.bad{background:color-mix(in srgb,var(--red) 14%,var(--card))}
.banner.ok{background:color-mix(in srgb,var(--green) 14%,var(--card))}
.donutcard{display:flex;gap:16px;align-items:center}
.donut{width:136px;height:136px;flex:none}
.legend2{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.lg{display:flex;align-items:center;gap:8px;font-size:14px;text-align:left;width:100%}
.lg .dot,.distleg .dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.lg .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .n{color:var(--label2);font-variant-numeric:tabular-nums}
@media (max-width:370px){.donutcard{flex-direction:column;align-items:stretch}.donut{align-self:center}}
.goalmini .meter{margin-top:12px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-top:6px;scrollbar-width:none}
.pills button{flex:none;padding:8px 15px;border-radius:999px;background:var(--card);font-size:15px;font-weight:500}
.pills button[aria-pressed="true"]{background:var(--label);color:var(--bg)}
.filterchip{margin-top:10px;padding:7px 12px;border-radius:999px;background:color-mix(in srgb,var(--blue) 14%,var(--card));color:var(--blue);font-weight:600;font-size:14px}
.bars{margin-top:10px}.bars svg{display:block;width:100%;height:auto}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding-bottom:2px}
.hscroll::-webkit-scrollbar,.pills::-webkit-scrollbar{display:none}
.acard{flex:none;width:172px;scroll-snap-align:start;background:var(--card);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px}
.acard:active,.cchip:active{transform:scale(.97)}
.acard .atop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px}
.acard .rate{font-size:11px;font-weight:600;color:var(--label2);background:var(--fill);padding:3px 7px;border-radius:7px;white-space:nowrap}
.acard .aname{font-size:15px;color:var(--label2)}
.acard .abal{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .s{font-size:12px;margin-top:2px}
.acard.add{align-items:center;justify-content:center;gap:8px;color:var(--blue);font-weight:600;border:1.5px dashed var(--label3);background:transparent;min-height:150px}
.distbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-top:14px;background:var(--fill)}
.distleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--label2);margin-top:8px}
.distleg .dot{margin-right:5px}
.plusslot{display:grid;place-items:center}
.plus{width:54px;height:54px;border-radius:27px;background:var(--blue);color:var(--on);display:grid;place-items:center;margin-top:-16px;box-shadow:0 6px 16px color-mix(in srgb,var(--blue) 40%,transparent)}
.plus svg{width:24px;height:24px}
.plus:active{transform:scale(.94)}
.amountrow{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 0 4px;min-width:0}
.amtbig{font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;text-align:center;min-width:0}
.amtbig.ingreso{color:var(--green)} .amtbig.inv{color:var(--orange)}
.curchip{font-size:13px;font-weight:700;padding:6px 9px;border-radius:8px;background:var(--fill);color:var(--label2);flex:none}
.chipgrid.hscroll{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:78px;gap:8px;margin-top:10px;padding:2px}
.cchip{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:14px;background:var(--card);font-size:11.5px;line-height:1.15;border:2px solid transparent;scroll-snap-align:start}
.cchip .cl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:center;max-width:100%}
.cchip.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--card))}
.metarow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.dchip{padding:8px 13px;border-radius:999px;background:var(--card);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.dchip[aria-pressed="true"],.dchip.on{background:var(--label);color:var(--bg)}
.dchip input{border:0;background:transparent;font:inherit;color:inherit;padding:0;max-width:140px;min-width:0}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.keypad button{height:52px;border-radius:14px;background:var(--card);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.keypad button:active{background:var(--fill)}
.sheethero{display:flex;justify-content:center;padding:8px 0 0}
.avbtn{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--blue);font-size:14px}
.emojigrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:10px;background:var(--card);border-radius:14px;margin-top:10px}
.emojigrid button{font-size:22px;height:38px;border-radius:9px}
.emojigrid button[aria-pressed="true"]{background:var(--fill)}

/* ---------- v4: round bubbles, small currency, columns ---------- */
.avatar,.avatar.sm,.avatar.lg{border-radius:50%}
.cs{font-size:.55em;font-weight:600;margin-right:.12em;vertical-align:.32em;opacity:.85}
.fit{display:block;white-space:nowrap;overflow:hidden;max-width:100%}
.stat .v.fit{font-size:17px}
.hero .big{font-size:46px}
.goalrow{display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:14px;border-top:.5px solid var(--sep)}
.goalrow svg{width:72px;height:72px;flex:none}
.acard .aname{font-size:13px}
.acard .tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--fill);color:var(--label2);white-space:nowrap}
.acard .tag.goal{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.acard .abal{font-size:24px;margin-top:2px}
.amtbig{font-size:48px;flex:0 1 auto;min-width:0;max-width:calc(100% - 92px)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.switch[aria-checked="true"]{background:var(--green)}
.switch span{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.22);transition:transform .2s}
.switch[aria-checked="true"] span{transform:translateX(20px)}
.cols{display:flex;gap:4px;align-items:flex-end}
.colb{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0;border-radius:14px}
.colb:active{background:var(--fill)}
.colb .track{position:relative;width:44px;height:130px}
.colb .plan{position:absolute;left:0;right:0;bottom:0;border:1.5px dashed var(--label3);border-radius:14px}
.colb .fill{position:absolute;left:0;right:0;bottom:0;border-radius:14px}
.colb .pc{font-size:11px;font-weight:600;color:var(--label2)}
.colb .amt{font-size:12.5px;font-weight:700;white-space:nowrap}
.colb .of{font-size:10.5px;color:var(--label2);white-space:nowrap;margin-top:-5px}
.chipgrid.hscroll.one{grid-template-rows:auto}

.why{margin-top:12px;border-top:.5px solid var(--sep);padding-top:10px;font-size:14px;color:var(--label2)}
.why summary{color:var(--blue);font-weight:600;cursor:pointer;list-style:none}
.why summary::-webkit-details-marker{display:none}
.why p{margin:8px 0;line-height:1.4}
.kvs{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:12px;padding:10px 12px}
.kvs div{display:flex;justify-content:space-between;gap:10px}
.kvs b{color:var(--label);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

.plancard{padding:14px 14px 12px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pcol{min-width:0}
.pcol .l{font-size:12px;color:var(--label2)}
.pcol .v{font-size:17px;font-weight:700;margin-top:2px}
.pcol .pbar{margin-top:6px}
.pcol .s{font-size:11.5px;color:var(--label2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstatus{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:.5px solid var(--sep)}
.pstatus .more{display:flex;align-items:center;gap:6px;color:var(--blue);font-size:14px;white-space:nowrap}
.pstatus .more svg{width:7px;height:12px}

.swipe{position:relative;overflow:hidden}
.swipe .sw-del{position:absolute;top:0;bottom:0;right:0;width:96px;background:var(--red);color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 6px;line-height:1.2}
.swipe .sw-content{background:var(--card);transition:transform .22s ease;touch-action:pan-y;z-index:1}
.swipe.dragging .sw-content{transition:none}
.swipe.open .sw-content{transform:translateX(-96px)}
.swipe + .swipe > .cell::before,.cell + .swipe > .cell::before,.swipe + .cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.toast{display:flex;align-items:center;gap:12px}
.toast button{color:var(--blue);font-weight:700}
</style>

<body>

<div id="app"><div class="app"><div class="head"><div class="headrow"><span class="save">Cargando…</span></div><h1 class="title">Mi Presupuesto</h1></div><p class="empty">Cargando tu presupuesto…</p></div></div>

<script>
(() => {
/* ================= model ================= */
const GROUPS = [
  {kind:'income',  name:'Ingresos',         act:'Recibido', color:'var(--green)'},
  {kind:'invest',  name:'Inversión',        act:'Aportado', color:'var(--orange)'},
  {kind:'fixed',   name:'Gastos fijos',     act:'Gastado',  color:'var(--blue)'},
  {kind:'variable',name:'Gastos variables', act:'Gastado',  color:'var(--blue)'}
];
const GNAME = Object.fromEntries(GROUPS.map(g=>[g.kind,g.name]));
const TEMPLATE = {
  income:['Salario','Ingresos extra'],
  fixed:['Arriendo / hipoteca','Servicios públicos','Internet y celular','Transporte','Salud / seguros','Deudas / tarjetas','Fondo de emergencia'],
  variable:['Mercado','Restaurantes y domicilios','Entretenimiento','Ropa y cuidado personal','Imprevistos'],
  invest:['Aporte a mi meta']
};
const EXAMPLE = {'Salario':6500000,'Arriendo / hipoteca':1800000,'Servicios públicos':280000,'Internet y celular':150000,'Transporte':300000,
  'Salud / seguros':250000,'Deudas / tarjetas':300000,'Fondo de emergencia':300000,'Mercado':900000,'Restaurantes y domicilios':350000,
  'Entretenimiento':200000,'Ropa y cuidado personal':170000,'Imprevistos':200000,'Aporte a mi meta':1300000};

const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'') : Math.random().toString(36).slice(2)+Date.now().toString(36)).slice(0,14);
const pad = n => String(n).padStart(2,'0');
const now = new Date();
const todayKey = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
const todayDate = `${todayKey}-${pad(now.getDate())}`;
const idxOf = k => { const [y,m] = String(k).split('-').map(Number); return y*12 + (m-1); };
const keyOf = i => `${Math.floor(i/12)}-${pad(i%12+1)}`;
const dt = (k,o) => { const [y,m]=k.split('-').map(Number); return new Intl.DateTimeFormat('es-CO',o).format(new Date(y,m-1,1)); };
const cap = t => t ? t[0].toUpperCase()+t.slice(1) : t;
const monthName = k => dt(k,{month:'long',year:'numeric'});
const monthOnly = k => dt(k,{month:'long'});
const monthShort = k => dt(k,{month:'short',year:'numeric'});
const dayLabel = d => { const [y,m,dd]=d.split('-').map(Number); const s=new Intl.DateTimeFormat('es-CO',{weekday:'long',day:'numeric',month:'long'}).format(new Date(y,m-1,dd)); return d===todayDate?'Hoy':s; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const RULES = {
  min:{name:'Mínimo saludable', n:60, g:25, s:15,
    why:'Fidelity recomienda ahorrar al menos el 15 % de lo que ganas para tu retiro. Es el punto de partida si tus gastos fijos son altos.'},
  balanced:{name:'Equilibrada', n:50, g:30, s:20,
    why:'La regla 50/30/20 de Elizabeth Warren (libro “All Your Worth”, 2005): la mitad para lo necesario, 30 % para gustos y 20 % para ahorrar e invertir.'},
  fast:{name:'Acelerada', n:50, g:20, s:30,
    why:'La tasa de ahorro es lo que más acorta el camino: ahorrando 30 % podrías vivir de tus inversiones en unos 28 años, frente a unos 43 ahorrando 15 % (regla del 4 % y 5 % de rentabilidad real).'}
};
const RULE_KEYS = ['min','balanced','fast'];
RULES.custom = {name:'Personalizado', n:50, g:30, s:20, why:'Tu propia combinación, creada al subir tu % de ahorro desde Inicio.'};
const ruleKeysShown = opts => opts && opts.custom ? [...RULE_KEYS,'custom'] : RULE_KEYS;
const BUCKET = {n:'Necesidades', g:'Gustos', s:'Ahorro e inversión'};
const defaultRule = () => ({active:'balanced', opts:Object.fromEntries(RULE_KEYS.map(k=>[k,{n:RULES[k].n, g:RULES[k].g, s:RULES[k].s}]))});
const defaultAccounts = (rate=10, initial=0) => [
  {id:'bolsa', name:'Bolsa', emoji:'📈', rate, rateType:'EA', initial, cur:'COP'},
  {id:'nu', name:'Nu', emoji:'💜', rate:0, rateType:'EA', initial:0, cur:'COP'}
];
const defaultSettings = () => ({
  currency:'COP', trm:4000, rules:'', theme:'auto', trmMode:'auto', trmAuto:null, trmHist:{}, rule:defaultRule(),
  goal:{name:'Mi meta de inversión', target:100000000, cur:'COP', years:5, start:todayKey, typical:0, accounts:defaultAccounts()}
});
const S = { settings:defaultSettings(), months:{}, cur:todayKey, tab:'home', mode:'loading', sheet:null, txFilter:'', toast:null, lastItem:null };

/* ================= money ================= */
const CURS = ['COP','USD'];
const base = () => S.settings.currency || 'COP';
const gcur = () => S.settings.goal.cur || 'COP';
const trmOf = k => { const m=S.months[k]; return Number(m && m.trm) || Number((S.settings.trmHist||{})[k]) || Number(S.settings.trm) || 4000; };
const conv = (a, from, to, trm) => { a=Number(a)||0; if (from===to) return a; return from==='USD' ? a*trm : a/trm; };
const fmtCache = {};
function money(n, c){
  c = c || base();
  const key = c;
  const f = fmtCache[key] || (fmtCache[key] = new Intl.NumberFormat('es-CO',{style:'currency',currency:c,minimumFractionDigits:0,maximumFractionDigits:c==='COP'?0:2}));
  const v = Math.round((Number(n)||0)*100)/100;
  return f.format(Math.abs(v) < 0.005 ? 0 : v);
}
const plain = (n, c) => n ? new Intl.NumberFormat('es-CO',{maximumFractionDigits:(c||base())==='COP'?0:2}).format(n) : '';
const compact = n => new Intl.NumberFormat('es-CO',{notation:'compact',maximumFractionDigits:1}).format(n);
const sym = c => c==='USD' ? 'US$' : '$';
/* accepts 1.200.000 · 1,200,000 · 1200000 · 12.5 · 12,5 · 1.200,50 */
function parseNum(s){
  let t = String(s ?? '').trim().replace(/[^\d.,\-]/g,''); if (!t) return 0;
  const neg = t.startsWith('-'); t = t.replace(/-/g,'');
  const i = Math.max(t.lastIndexOf('.'), t.lastIndexOf(','));
  let v;
  if (i >= 0) {
    const ch = t[i], after = t.length - i - 1, count = t.split(ch).length - 1;
    if (count===1 && after>0 && after<=2) v = parseFloat(t.slice(0,i).replace(/[.,]/g,'') + '.' + t.slice(i+1));
    else v = parseFloat(t.replace(/[.,]/g,''));
  } else v = parseFloat(t);
  if (!isFinite(v)) return 0;
  return neg ? -v : v;
}

/* ================= months ================= */
function templateMonth(){
  const groups = {};
  for (const g of GROUPS) groups[g.kind] = g.kind==='invest'
    ? accounts().map(a => ({id:uid(), name:'Aporte a '+a.name, planned:0, cur:gcur(), acct:a.id}))
    : TEMPLATE[g.kind].map(n => ({id:uid(), name:n, planned:0, cur:base()}));
  return {groups, tx:[]};
}
function normMonth(m){
  m.groups = m.groups || {}; for (const g of GROUPS) m.groups[g.kind] = m.groups[g.kind] || [];
  m.tx = Array.isArray(m.tx) ? m.tx : [];
  if (m.portfolio!=null && m.portfolio!==''){ const a0=(accounts()[0]||{}).id; m.balances=m.balances||{}; if (a0 && m.balances[a0]==null) m.balances[a0]=Number(m.portfolio); }
  delete m.portfolio;
  return m;
}
function getMonth(k, create){
  if (S.months[k]) return S.months[k];
  if (S._draft && S._draft.k===k) { if (create) { S.months[k]=S._draft.m; delete S.months[k]._copiedFrom; S._draft=null; return S.months[k]; } return S._draft.m; }
  const earlier = Object.keys(S.months).filter(x => x < k).sort().pop();
  let m;
  if (earlier) {
    const src = S.months[earlier], groups = {};
    for (const g of GROUPS) groups[g.kind] = (src.groups[g.kind]||[]).map(it => ({...it, planned:it.planned||0, cur:it.cur||'COP'}));
    m = {groups, tx:[], _copiedFrom:earlier};
    if (src.trm) m.trm = src.trm;
  } else m = templateMonth();
  if (create) { delete m._copiedFrom; S.months[k] = m; S._draft=null; }
  else S._draft = {k, m};   // keep the same unsaved copy (stable ids) until something is saved
  return m;
}
const itemCur = it => it.cur || 'COP';
function itemsOf(m){ const out=[]; for (const g of GROUPS) for (const it of (m.groups[g.kind]||[])) out.push({...it, kind:g.kind}); return out; }
function findItem(m,id){ for (const g of GROUPS){ const it=(m.groups[g.kind]||[]).find(i=>i.id===id); if (it) return {it, kind:g.kind}; } return null; }
function actualOf(m, it, trm){ let s=0; for (const t of m.tx) if (t.itemId===it.id) s += conv(t.amount, t.cur||itemCur(it), itemCur(it), trm); return s; }
function totals(m, k){
  const trm = trmOf(k), b = base(), t = {income:[0,0], fixed:[0,0], variable:[0,0], invest:[0,0]};
  for (const g of GROUPS) for (const it of (m.groups[g.kind]||[])) {
    if (g.kind!=='invest') t[g.kind][0] += conv(it.planned, itemCur(it), b, trm);
    t[g.kind][1] += conv(actualOf(m,it,trm), itemCur(it), b, trm);
  }
  t.invest[0] = needFor(k);
  return t;
}
/* the aporte your goal asks for in month k (same as “Debes aportar” in Inversión), in your main currency */
function needFor(k){
  if (!accounts().length) return 0;
  const i=Math.max(idxOf(k), startIdx());
  return conv(pmtAll(balancesBefore(i), goal().target, Math.max(0,endIdx()-i)), gcur(), base(), trmOf(k));
}
const NEED_RE = /arriendo|hipoteca|servicio|internet|celular|transporte|salud|seguro|deuda|tarjeta|mercado|imprevist|cr[eé]dito|educaci|colegio|universidad/i;
const SAVE_RE = /fondo|ahorro|emergencia|inversi|pensi[oó]n/i;
function bucketOf(it, kind){
  if (it.bucket && BUCKET[it.bucket]) return it.bucket;
  if (kind==='invest' || SAVE_RE.test(it.name||'')) return 's';
  if (kind==='fixed') return 'n';
  return NEED_RE.test(it.name||'') ? 'n' : 'g';
}
function bucketTotals(m, k){
  const trm=trmOf(k), b=base(), t={n:[0,0], g:[0,0], s:[0,0]};
  for (const g of GROUPS){ if (g.kind==='income') continue;
    for (const it of (m.groups[g.kind]||[])){ const bk=bucketOf(it,g.kind);
      t[bk][0]+=conv(it.planned, itemCur(it), b, trm); t[bk][1]+=conv(actualOf(m,it,trm), itemCur(it), b, trm); } }
  return t;
}
const activeRule = () => { const r=S.settings.rule||defaultRule(); const o=(r.opts||{})[r.active]||RULES[r.active]||RULES.balanced; return {key:r.active, name:(RULES[r.active]||RULES.balanced).name, n:+o.n||0, g:+o.g||0, s:+o.s||0}; };
const usesUSD = m => itemsOf(m).some(i=>itemCur(i)!==base()) || m.tx.some(t=>t.cur && t.cur!==base());

/* ================= goal math (EA -> monthly compounding) ================= */
const goal = () => S.settings.goal;
const ACOLORS = ['#0A84FF','#BF5AF2','#30D158','#FF9F0A','#FF375F','#64D2FF','#5E5CE6'];
const accounts = () => goal().accounts || [];
const goalAccounts = () => accounts();
const acctById = id => accounts().find(a=>a.id===id);
const acctColor = a => a.color || ACOLORS[Math.max(0,accounts().indexOf(a))%ACOLORS.length];
const acctCur = a => (a && a.cur) || gcur();
const acctRate = a => { const r=(Number(a.rate)||0)/100; return a.rateType==='EM' ? r : Math.pow(1+r,1/12)-1; };
const acctEA = a => a.rateType==='EM' ? (Math.pow(1+(Number(a.rate)||0)/100,12)-1)*100 : (Number(a.rate)||0);
const pctTxt = n => (Math.round((Number(n)||0)*100)/100).toLocaleString('es-CO',{maximumFractionDigits:2});
const rateTxt = a => `${pctTxt(a.rate)} % ${a.rateType==='EM'?'mensual':'EA'}`;
const sum = arr => arr.reduce((s,x)=>s+(Number(x)||0),0);
const startIdx = () => idxOf(goal().start || todayKey);
const endIdx = () => startIdx() + Math.max(1, Math.round((Number(goal().years)||1)*12));
/* investment lines belong to an account; lines without one go to the first account */
function itemAcct(it){ const ac=accounts(); return (it.acct && ac.some(a=>a.id===it.acct)) ? it.acct : (ac[0]||{}).id; }
/* aportes of month k to account a, in the account's own currency */
function contribNative(k, a){
  const m=S.months[k]; if (!m || !a) return 0; const trm=trmOf(k); let s=0;
  for (const it of (m.groups.invest||[])) if (itemAcct(it)===a.id) s += conv(actualOf(m,it,trm), itemCur(it), acctCur(a), trm);
  return s;
}
const toGoalCur = (a, v, k) => conv(v, acctCur(a), gcur(), trmOf(k));
const contribAcct = (k, aid) => { const a=acctById(aid); return a ? toGoalCur(a, contribNative(k,a), k) : 0; };
const contribOf = k => sum(goalAccounts().map(a=>contribAcct(k,a.id)));
function balReal(k, aid){ const m=S.months[k], b=m && m.balances; return b && b[aid]!=null && b[aid]!=='' ? Number(b[aid]) : null; }
/* each account grows at its own rate in its own currency; a real balance for a month overrides the estimate */
function acctValueAt(a, i){
  const r=acctRate(a); let v=Number(a.initial)||0;
  for (let j=startIdx(); j<=i; j++){ const k=keyOf(j); v = v*(1+r) + contribNative(k,a); const rb=balReal(k,a.id); if (rb!=null) v=rb; }
  return v;
}
/* the goal only looks at accounts marked “cuenta para mi meta”, converted to the goal currency */
const balancesAt = (i, list=goalAccounts()) => list.map(a=>toGoalCur(a, acctValueAt(a,i), keyOf(i)));
const balancesBefore = (i, list=goalAccounts()) => i<=startIdx() ? list.map(a=>toGoalCur(a, Number(a.initial)||0, keyOf(startIdx()))) : balancesAt(i-1, list);
const valueAt = i => sum(balancesAt(i));
const valueBefore = i => sum(balancesBefore(i));
/* new aportes earn the average rate of the goal accounts, weighted by planned aportes (or by balance) */
let _rc=null;
function contribRate(){
  if (_rc!=null) return _rc;
  const ac=goalAccounts(); if (!ac.length) return (_rc=0);
  const m=getMonth(S.cur,false), trm=trmOf(S.cur);
  let w=balancesAt(Math.max(idxOf(S.cur),startIdx()));
  if (!(sum(w)>0)) w=ac.map((a,i)=>i===0?1:0);
  return (_rc = ac.reduce((s,a,i)=>s+acctRate(a)*(w[i]||0),0)/sum(w));
}
function growAll(bals, n, p){
  let t=0; goalAccounts().forEach((a,i)=>{ t += (bals[i]||0)*Math.pow(1+acctRate(a),n); });
  const rc=contribRate(); return t + (rc===0 ? p*n : p*(Math.pow(1+rc,n)-1)/rc);
}
function pmtAll(bals, target, n){
  if (n<=0) return Math.max(0,target-sum(bals));
  const rc=contribRate(), f = rc===0 ? n : (Math.pow(1+rc,n)-1)/rc;
  return Math.max(0,(target-growAll(bals,n,0))/f);
}
function reachAll(bals, p, target){ if (sum(bals)>=target) return 0; for (let n=1;n<=1200;n++) if (growAll(bals,n,p)>=target) return n; return Infinity; }
const blendedEA = () => (Math.pow(1+contribRate(),12)-1)*100;
const fmtMonths = n => { if (!isFinite(n)) return 'No llegas'; const y=Math.floor(n/12), m=n%12; return [y?`${y} año${y>1?'s':''}`:'', m?`${m} mes${m>1?'es':''}`:''].filter(Boolean).join(' y ') || 'Ya llegaste'; };

/* ================= persistence ================= */
let db = null;
const LS = 'mi-presupuesto-v1';
const W = {}; const dirty = new Set();
let saveText = 'Cargando…', saveErr = false;
const DIAG = {reason:'', lastErr:'', lastSaved:null, localOk:true};
const errCode = e => (e && (e.code || e.name)) ? String(e.code || e.name) + (e.message ? ': ' + e.message : '') : String(e);
function setSave(t, err){ saveText=t; saveErr=!!err; const el=document.getElementById('saveSt'); if (el){ el.textContent=t; el.classList.toggle('err',saveErr); } }
function persistLocal(){ localStorage.setItem(LS, JSON.stringify({settings:S.settings, months:S.months})); }
function docData(path){
  if (path==='budget/settings') return S.settings;
  const m = S.months[path.slice(7)]; if (!m) return null;
  const c = JSON.parse(JSON.stringify(m)); delete c._copiedFrom; return c;
}
function save(path){
  const w = W[path] || (W[path]={ver:0,saved:0,fails:0});
  w.ver++; dirty.add(path); clearTimeout(w.timer);
  setSave('Guardando…');
  w.timer = setTimeout(() => flush(path), 400);
}
async function flush(path){
  const w=W[path]; if (!w || w.inflight) return; clearTimeout(w.timer); w.inflight=true; const v=w.ver; let ok=true;
  try {
    const data = docData(path);
    if (S.mode==='db') { if (data) await db.doc(path).set(JSON.parse(JSON.stringify(data))); else await db.doc(path).delete(); }
    else persistLocal();
    w.saved=v; w.fails=0; DIAG.lastSaved=new Date(); DIAG.lastErr='';
  } catch(e){ ok=false; w.fails++; DIAG.lastErr=errCode(e); setSave('No se pudo guardar · reintentando', true); if (w.fails===1) render(); }
  w.inflight=false;
  if (!ok) { w.timer=setTimeout(()=>flush(path), Math.min(30000, 1500*2**w.fails)); return; }
  if (w.ver!==w.saved) return flush(path);
  dirty.delete(path);
  if (!dirty.size) setSave(S.mode==='db' ? 'Guardado' : 'Guardado en el teléfono');
}
const flushAll = () => { for (const p of [...dirty]) flush(p); };
const saveSettings = () => save('budget/settings');
const saveMonth = k => { if (S._draft && S._draft.k!==k) S._draft=null; getMonth(k,true); save('months/'+k); };

function mergeSettings(d){
  const def=defaultSettings();
  d = d || {};
  const rule = {...def.rule, ...(d.rule||{}), opts:{...def.rule.opts, ...((d.rule||{}).opts||{})}};
  if (!RULES[rule.active]) rule.active='balanced';
  if (!d.ruleFix1){
    for (const k of RULE_KEYS) rule.opts[k]={n:RULES[k].n, g:RULES[k].g, s:RULES[k].s};
    delete rule.undo; if (rule.active==='custom' && !rule.opts.custom) rule.active='balanced';
    d = {...d, ruleFix1:true};
  }
  const dg = d.goal || {};
  const g = {...def.goal, ...dg};
  if (!Array.isArray(dg.accounts) || !dg.accounts.length) g.accounts = defaultAccounts(dg.rate!=null ? Number(dg.rate)||0 : 10, Number(dg.initial)||0);

}

let sw=null, swipeJustEnded=false;

  swipeJustEnded=false;

  const del=e.target.closest && e.target.closest('.sw-del'), mine=(c||del) && (c||del).parentElement;
  document.querySelectorAll('.swipe.open').forEach(w => { if (w!==mine) w.classList.remove('open'); });
  if (!c) return;

    else if (Math.abs(dy)>10){ sw=null; return; } else return;
  }
  sw.dx=dx; sw.el.style.transform=`translateX(${Math.min(0,Math.max(-130, sw.base+dx))}px)`;
});
const swEnd = () => {
  if (!sw) return;
  if (sw.active){ const open = sw.base+sw.dx < -48; sw.wrap.classList.remove('dragging'); sw.el.style.transform=''; sw.wrap.classList.toggle('open', open); swipeJustEnded=true; }

/* what you spent on this category last month (to repeat a fixed payment with one tap) */
function lastMonthSpent(k, it){

}
function budgetColumns(m,k){

  cols.sort((x,y)=>Math.max(y.pl,y.ac)-Math.max(x.pl,x.ac));

      ${avatar(emojiOf(c.it,c.kind), col, 'sm')}
      <span class="amt">${esc(moneyShort(c.ac))}</span><span class="of">${c.pl>0?`de ${esc(moneyShort(c.pl))}`:'&nbsp;'}</span></button>`; }).join('')}</div>

function groupHtml(m,k,g,t){

    let sub, cls='';
    if (g.kind==='income' || g.kind==='invest'){
      const last=lastMonthSpent(k,it), a=g.kind==='invest' ? acctById(itemAcct(it)) : null, pre = a ? esc(a.name)+' · ' : '';
      if (pl && ac>=pl){ sub = pre + (g.kind==='income' ? 'Te llegó todo lo esperado ✓' : 'Cumpliste el aporte ✓'); cls='green'; }

      else if (pl) sub=`Te quedan ${money(rem,c)} del límite`;
      else if (n) sub=`${n} gasto${n>1?'s':''} este mes`;
      else if (last>0) sub=`El mes pasado: ${money(last,c)} · toca para pagarlo`;

    <div class="list">${goalRow}${rows}${ghost}<button class="cell blue" data-act="${g.kind==='invest'?'goalTx':'newItem'}" data-g="${g.kind}">${plusIc}<span>${g.kind==='income'?'Nueva fuente de ingreso':g.kind==='invest'?'Registrar un aporte':'Añadir gasto'}</span></button></div>${hint}

/* everything the savings plan says, computed once (card on Inicio + detail sheet) */
function planCalc(m,k,t){
  const r=activeRule(), inc=t.income[0]||t.income[1];
  if (inc<=0) return {r, inc};
  const bt=bucketTotals(m,k), lim={n:inc*r.n/100, g:inc*r.g/100, s:inc*r.s/100}, b=base(), trm=trmOf(k);
  const G=goalStats(), needB=conv(G.need,gcur(),b,trm), pctNeed=Math.min(100,Math.ceil(needB/inc*100));
  const realB = G.paceP>0 ? conv(G.paceP,gcur(),b,trm) : null;
  const reaches = G.paceP>0 && isFinite(G.pace) && G.si+G.pace<=G.ei;
  let state, short, tie;
  if (lim.s >= needB-0.5){ state='ok'; short='Tu plan alcanza para tu meta';
    tie=`Tu meta pide ${money(needB)} al mes y tu plan de ahorro (${r.s} %) deja ${money(lim.s)}.${lim.s-needB>0.5?` Lo que sobra (${money(lim.s-needB)}) puede ir a tu fondo de emergencia.`:''}`; }
  else if (reaches){ state='ok'; short='Vas bien con tu meta';
    tie=`Tu plan de ahorro (${r.s} %) deja ${money(lim.s)}, menos de los ${money(needB)} que pide tu meta. Pero como hoy aportas ${money(realB)} al mes, sí llegas a tiempo. Para que el plan cuadre con lo que de verdad haces, súbelo a ${pctNeed} %.`; }
  else if (realB!=null){ state='bad'; short='Así no llegas a tiempo a tu meta';
    tie=`Tu meta pide ${money(needB)} al mes (${pctNeed} % de lo que ganas). Hoy aportas ${money(realB)} y tu plan de ahorro (${r.s} %) deja ${money(lim.s)}. Sube tu ahorro o amplía el plazo en Inversión.`; }
  else { state='bad'; short='Tu plan no alcanza para tu meta';
    const n=reachAll(balancesBefore(G.si), conv(lim.s,b,gcur(),trm), goal().target);
    tie=`Tu meta pide ${money(needB)} al mes (${pctNeed} % de lo que ganas) y tu plan de ahorro (${r.s} %) deja ${money(lim.s)}. ${isFinite(n)?`Ahorrando eso llegarías en ${fmtMonths(n).toLowerCase()}.`:''} Sube tu ahorro o amplía el plazo en Inversión.`; }
  return {r, inc, bt, lim, needB, pctNeed, state, short, tie, ef:bt.n[0]||lim.n};
}

/* ---------- movements ---------- */
const TX_KINDS = [['all','Todo'],['gasto','Gastos'],['ingreso','Ingresos'],['inv','Inversión']];
const kindToTx = k => k==='income' ? 'ingreso' : k==='invest' ? 'inv' : 'gasto';
function viewTx(){
  const k=S.cur, m=getMonth(k,false), trm=trmOf(k), b=base();
  const kind=S.txKind||'all', f=S.txFilter;
  const kindOfTx = x => { const fi=findItem(m,x.itemId); return fi ? kindToTx(fi.kind) : 'gasto'; };
  const list=m.tx.filter(x => f ? x.itemId===f : (kind==='all' || kindOfTx(x)===kind))
    .sort((a,b2)=>(b2.date||'').localeCompare(a.date||''));
  const inBase = x => { const fi=findItem(m,x.itemId); return conv(x.amount, x.cur||(fi?itemCur(fi.it):'COP'), b, trm); };
  const fi0 = f ? findItem(m,f) : null;
  const sumOf = arr => arr.reduce((s,x)=>s+inBase(x),0);
  const spendTx = m.tx.filter(x => kindOfTx(x)==='gasto');
  let label, total;
  if (f){ label=`En ${fi0?fi0.it.name:'esta categoría'}`; total=sumOf(list); }
  else if (kind==='ingreso'){ label='Te llegó'; total=sumOf(list); }
  else if (kind==='inv'){ label='Invertiste'; total=sumOf(list); }
  else { label='Gastaste'; total=sumOf(spendTx); }
  const chartTx = f || kind==='ingreso' || kind==='inv' ? list : spendTx;
  // bars per day of the month
  const dim=new Date(+k.slice(0,4), +k.slice(5,7), 0).getDate(), days=new Array(dim).fill(0);
  for (const x of chartTx){ const d=Number((x.date||'').slice(8,10)); if (d>=1 && d<=dim) days[d-1]+=inBase(x); }
  const maxD=Math.max(...days,1), W=340, H=86, bw=W/dim;
  const todayD = k===todayKey ? now.getDate() : 0;
  const color = kind==='ingreso' ? 'var(--green)' : kind==='inv' ? 'var(--orange)' : 'var(--blue)';
  const bars = days.map((v,i)=>{ const h=v>0?Math.max(3,v/maxD*(H-20)):2; return `<rect x="${(i*bw+1).toFixed(1)}" y="${(H-16-h).toFixed(1)}" width="${Math.max(1,bw-2).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${v>0?color:'var(--fill)'}" opacity="${!todayD||i+1===todayD||v===0?1:.55}"/>`; }).join('');
  const ticks=[1,Math.ceil(dim/2),dim].map(d=>`<text x="${((d-.5)*bw).toFixed(1)}" y="${H-2}" text-anchor="middle" font-size="10" fill="var(--label2)" font-family="var(--font)">${d}</text>`).join('');
  // grouped list
  let html='', lastDay='', dayItems=[];
  const flushDay = () => {
    if (!lastDay) return;
    const daySpend = dayItems.filter(x=>kindOfTx(x)==='gasto').reduce((s,x)=>s+inBase(x),0);
    html += `<div class="sec" style="margin-top:18px"><div class="sech"><span>${esc(cap(dayLabel(lastDay)))}</span>${daySpend?`<b class="n">−${money(daySpend)}</b>`:''}</div><div class="list">${dayItems.map(txRow).join('')}</div></div>`;
  };
  const txRow = x => {
    const fi=findItem(m,x.itemId), it=fi&&fi.it, kd=fi?fi.kind:'variable', c=x.cur||(it?itemCur(it):'COP');
    const sign = kd==='income' ? '+' : '−', cls = kd==='income' ? 'green' : kd==='invest' ? 'orange' : '';
    return `<button class="cell" data-act="editTx" data-id="${esc(x.id)}">${avatar(it?emojiOf(it,kd):'❔', it?colorOf(it,kd):'#8E8E93')}
      <div class="main"><div class="t">${it?esc(it.name):'Sin categoría'}</div><div class="s t">${esc(x.note || GNAME[kd] || '')}</div></div>
      <div class="v ${cls}" style="font-weight:600">${sign} ${money(x.amount,c)}${c!==b?`<small>≈ ${money(conv(x.amount,c,b,trm))}</small>`:''}</div></button>`;
  };
  for (const x of list){ if (x.date!==lastDay){ flushDay(); lastDay=x.date; dayItems=[]; } dayItems.push(x); }
  flushDay();
  return `

}

/* ---------- investment ---------- */
function goalStats(){
  const gl=goal(), gc=gcur(), s0=startIdx(), ei=endIdx(), ci=idxOf(S.cur), si=Math.max(ci,s0), ac=goalAccounts();
  const kS=keyOf(s0), kNow=keyOf(si), total=ei-s0;
  const init=ac.map(a=>toGoalCur(a, Number(a.initial)||0, kS));
  const bPrev=balancesBefore(si), vPrev=sum(bPrev), remainingM=Math.max(0,ei-si);
  const need = ac.length ? pmtAll(bPrev, gl.target, remainingM) : 0, put=contribOf(S.cur);
  const planP = ac.length ? pmtAll(init, gl.target, total) : 0;
  const done=Math.max(0,Math.min(total, si-s0)), expected=growAll(init, done, planP);
  // every account, in its own currency
  const nativeNow = a => { const rb=balReal(kNow,a.id); if (rb!=null) return rb; const prev = si<=s0 ? (Number(a.initial)||0) : acctValueAt(a, si-1); return prev + contribNative(kNow,a); };
  const hasReal = a => { for (let i=s0;i<=si;i++) if (balReal(keyOf(i),a.id)!=null) return true; return false; };
  const accts = accounts().map(a => {
    const cur=acctCur(a), nowN=nativeNow(a); let pocket=Number(a.initial)||0;
    for (let i=s0;i<=si;i++) pocket += contribNative(keyOf(i),a);
    return {a, cur, nowN, now:toGoalCur(a,nowN,kNow), pocket, gain:nowN-pocket, known:(Number(a.initial)||0)>0 || !hasReal(a),
      put:contribNative(S.cur,a), color:acctColor(a)};
  });
  const goalAccts = accts, now_ = goalAccts.map(x=>x.now), vNow=sum(now_);
  let totalIn=0, monthsWith=0; const hist=[];
  for (let i=s0;i<=si;i++){
    const k=keyOf(i), c=contribOf(k); totalIn+=c;
    if (c>0 && i<ci) monthsWith++;
    const reals=ac.map(a=>balReal(k,a.id)), anyReal=reals.some(r=>r!=null);
    if (c>0 || anyReal) hist.push({k, c, real: anyReal ? sum(ac.map((a,j)=>reals[j]!=null ? toGoalCur(a,reals[j],k) : 0)) : null});
  }
  const recorded = monthsWith ? hist.filter(h=>idxOf(h.k)<ci).reduce((a,h)=>a+h.c,0)/monthsWith : (put>0 ? put : null);
  const typical=Number(gl.typical)||0, paceP = typical>0 ? typical : recorded;
  const paceSrc = typical>0 ? 'el aporte mensual que pusiste' : monthsWith ? `el promedio de ${monthsWith} mes${monthsWith>1?'es':''} con aportes` : put>0 ? 'lo que aportaste este mes' : '';
  const pace = paceP==null || !ac.length ? null : reachAll(now_, paceP, gl.target);
  let lastReal=null; for (let i=si;i>=s0 && !lastReal;i--){ if (accounts().some(a=>balReal(keyOf(i),a.id)!=null)) lastReal=keyOf(i); }
  const pocketG = sum(init)+totalIn;
  return {gl, gc, s0, ei, ci, si, total, bPrev, vPrev, v:vNow, now:now_, remainingM, need, put, planP, done, expected, have:vNow, totalIn, hist,
    paceP, paceSrc, pace, lastReal, accts, goalAccts, patrimonio:sum(accts.map(x=>x.now)), pocket:pocketG, gain:vNow-pocketG};
}

function chartSvg(g){
  const gl=g.gl, s0=g.s0, ei=g.ei, si=g.si, W=360, H=210, L=44, R=10, T=12, B=24;
  const hist=[[s0-1, sum(balancesBefore(s0))]];
  for (let i=s0;i<=Math.min(si,ei-1);i++) hist.push([i, i===si ? g.v : valueAt(i)]);
  const plan=[[si-1,g.vPrev]]; for (let k=1;k<=ei-si;k++) plan.push([si-1+k, growAll(g.bPrev,k,g.need)]);
  const pace=[]; if (g.paceP!=null){ pace.push([si,g.v]); for (let k=1;k<=ei-si-1;k++) pace.push([si+k, growAll(g.now,k,g.paceP)]); }
  const maxV = Math.max(gl.target, ...pace.map(p=>p[1]), ...hist.map(p=>p[1]))*1.1 || 1;
  const x=i=>L+(i-(s0-1))/(ei-(s0-1))*(W-L-R), y=val=>T+(1-Math.max(0,val)/maxV)*(H-T-B);
  const path=pts=>pts.map((p,j)=>`${j?'L':'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  const raw=maxV/4, p10=Math.pow(10,Math.floor(Math.log10(raw))), step=[1,2,2.5,5,10].map(q=>q*p10).find(s=>s>=raw);
  let grid=''; for (let val=0; val<=maxV; val+=step) grid+=`<line x1="${L}" x2="${W-R}" y1="${y(val).toFixed(1)}" y2="${y(val).toFixed(1)}" stroke="var(--sep)"/><text x="${L-6}" y="${(y(val)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--label2)" font-family="var(--font)">${compact(val)}</text>`;
  const yrs=Number(gl.years)||1, every = yrs>20?10:yrs>10?5:yrs>5?2:1;
  let xt=''; for (let k=0;k<=yrs;k+=every){ const i=s0-1+k*12; xt+=`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="${k===0?'start':k>=yrs?'end':'middle'}" font-size="10" fill="var(--label2)" font-family="var(--font)">${keyOf(i+1).slice(0,4)}</text>`; }
  const last=hist[hist.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyección de tu inversión hacia la meta">
    ${grid}${xt}
    <line x1="${L}" x2="${W-R}" y1="${y(gl.target).toFixed(1)}" y2="${y(gl.target).toFixed(1)}" stroke="var(--label)" stroke-opacity=".45" stroke-dasharray="4 4"/>
    <text x="${L+4}" y="${(y(gl.target)-5).toFixed(1)}" font-size="10" font-weight="600" fill="var(--label)" font-family="var(--font)">Meta ${compact(gl.target)}</text>
    ${pace.length>1?`<path d="${path(pace)}" fill="none" stroke="var(--label2)" stroke-width="1.6" stroke-dasharray="2 3"/>`:''}
    <path d="${path(plan)}" fill="none" stroke="var(--blue)" stroke-width="2"/>
    <path d="${path(hist)}L${x(last[0]).toFixed(1)},${y(0).toFixed(1)}L${x(s0-1).toFixed(1)},${y(0).toFixed(1)}Z" fill="var(--orange)" opacity=".16"/>
    <path d="${path(hist)}" fill="none" stroke="var(--orange)" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="${x(last[0]).toFixed(1)}" cy="${y(last[1]).toFixed(1)}" r="4" fill="var(--orange)" stroke="var(--card)" stroke-width="2"/>
  </svg>`;
}

const fmtTyping = raw => { if (!raw) return '0'; const [i,d]=String(raw).split(','); const n=i ? Number(i).toLocaleString('es-CO') : '0'; return d!==undefined ? `${n},${d}` : n; };
const rawOf = n => { const v=Math.round((Number(n)||0)*100)/100; return v ? String(v).replace('.',',') : ''; };
const yesterday = (() => { const d=new Date(now); d.setDate(d.getDate()-1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; })();
function itemWords(g, existing){
  if (g==='income') return {title:'Nueva fuente de ingreso', namePh:'Ej. Salario, Freelance', noun:'fuente de ingreso', ask: existing ? 'Registrar lo que te llegó' : '¿Cuánto te llegó?', btn:'Registrar ingreso', done:'Ingreso registrado 💰',
    plan:'Espero recibir al mes', planPh:'Opcional', same:'Me llegó lo mismo que el mes pasado', list:'Te llegó en', other:'Registrar un monto de otro día',
    foot:'Lo que escribas se registra como plata que te llegó hoy.', planFoot:'Si pones cuánto esperas, te muestro cuánto te falta por recibir.'};
  if (g==='invest') return {title:'Nueva línea de aporte', namePh:'Ej. Aporte a Bolsa', noun:'línea de aporte', ask: existing ? 'Registrar un aporte' : '¿Cuánto invertiste?', btn:'Registrar aporte', done:'Aporte registrado 📈',
    plan:'Planeo aportar al mes', planPh:'Opcional', same:'Aporté lo mismo que el mes pasado', list:'Aportado en', other:'Registrar un aporte de otro día',
    foot:'Lo que escribas se registra como aporte de hoy y suma a la cuenta y a tu meta.', planFoot:'Cuánto debes aportar cada mes se calcula solo con tu meta (pestaña Inversión).'};
  return {title:'Nuevo gasto', namePh:'Ej. Gimnasio', noun:'gasto', ask: existing ? 'Anotar un gasto' : '¿Cuánto gastaste?', btn:'Guardar gasto', done:'Gasto anotado ✓',
    plan:'Límite al mes', planPh:'Sin límite', same:'Pagué lo mismo que el mes pasado', list:'Gastado en', other:'Anotar un gasto de otro día',
    foot:'Lo que escribas se anota como gasto de hoy.', planFoot:'Si le pones un límite, te aviso cuánto te queda y cuándo te pasas.'};
}
const itemBtnLabel = (sh, v) => parseNum(v)>0 ? itemWords(sh.g, !!sh.id).btn : (sh.id ? 'Guardar' : 'Añadir');
function emojiGrid(cur){ return `<div class="emojigrid">${EMOJI_PICK.map(e=>`<button type="button" data-act="pickEmoji" data-v="${e}" aria-pressed="${e===cur}" aria-label="${e}">${e}</button>`).join('')}</div>`; }

const defDate = () => S.cur===todayKey ? todayDate : `${S.cur}-01`;
function ensureAcctItem(m, aid){
  const inv = m.groups.invest = m.groups.invest || [];
  let it = inv.find(i=>i.acct===aid) || inv.find(i=>!i.acct && itemAcct(i)===aid);
  if (!it){ const a=acctById(aid); it={id:uid(), name:'Aporte a '+(a?a.name:'inversión'), planned:0, cur:acctCur(a), acct:aid}; inv.push(it); }
  return it;
}
function selectDefault(d, m, preset={}){
  if (d.kind==='inv'){ d.acct = preset.acct || (acctById(d.acct) ? d.acct : (goalAccounts()[0]||accounts()[0]||{}).id); if (!S.sheet || !S.sheet.curTouched) d.cur=acctCur(acctById(d.acct)); return; }
  const list = (d.kind==='ingreso' ? ['income'] : ['fixed','variable']).flatMap(g=>m.groups[g]||[]);
  const pick = (preset.itemId && list.find(i=>i.id===preset.itemId)) || list.find(i=>i.id===S.lastItem) || (d.kind==='gasto' ? (m.groups.variable||[])[0] : null) || list[0];
  d.itemId = pick ? pick.id : '';

}
function openTx(id, preset={}){
  const m=getMonth(S.cur,false), wasOpen=!!S.sheet;
  if (id){
    const x=m.tx.find(t=>t.id===id); if (!x) return;

    S.sheet={type:'tx', id, anim:!wasOpen, curTouched:true, draft:{kind, amt:rawOf(x.amount), cur:x.cur||(fi?itemCur(fi.it):base()), itemId:x.itemId, acct: fi&&fi.kind==='invest' ? itemAcct(fi.it) : null, date:x.date||defDate(), note:x.note||''}};
  } else {
    S.sheet=null;
    const d={kind:preset.kind||'gasto', amt:'', cur:base(), itemId:'', acct:null, date:preset.date||defDate(), note:''};
    selectDefault(d, m, preset);

function openItem(g, id){

  else { S.sheet={type:'item', g, anim:!wasOpen, draft:{name:'', planned:'', cur:g==='invest'?gcur():base(), bucket:g==='invest'?'s':g==='fixed'?'n':'g', emoji:null, acct:g==='invest'?(accounts()[0]||{}).id:null}}; S._focus='s-name'; }
}
function openAcct(id){
  const a = id ? acctById(id) : null, gc=gcur(), m=S.months[S.cur];
  const ac = a ? acctCur(a) : gc;

function sheetSave(){
  const sh=S.sheet; if (!sh) return; const d=sh.draft;
  if (sh.type==='tx'){
    const amount=parseFloat(String(d.amt||'').replace(',','.'))||0;
    if (!(amount>0)){ sh.err='Escribe el monto con el teclado'; return render(); }
    const src=getMonth(S.cur,false);
    let fi=null;
    if (d.kind!=='inv'){ fi=findItem(src,d.itemId); if (!fi){ sh.err='Elige una categoría'; return render(); } }
    else if (!acctById(d.acct)){ sh.err='Elige una cuenta'; return render(); }
    const date = /^\d{4}-\d{2}-\d{2}$/.test(d.date) ? d.date : defDate(), k=date.slice(0,7);
    let keepId=null;
    if (sh.id){
      const cm=getMonth(S.cur,true), old=cm.tx.find(t=>t.id===sh.id), ofi=old && findItem(cm,old.itemId);
      if (d.kind==='inv' && ofi && ofi.kind==='invest' && itemAcct(ofi.it)===d.acct) keepId=ofi.it.id;
      cm.tx=cm.tx.filter(t=>t.id!==sh.id); saveMonth(S.cur);
    }
    const m=getMonth(k,true);
    let itemId;
    if (d.kind==='inv') itemId = keepId && findItem(m,keepId) ? keepId : ensureAcctItem(m,d.acct).id;
    else { itemId=d.itemId; if (!findItem(m,itemId)) m.groups[fi.kind].push({...fi.it, planned:0}); }
    m.tx.push({id:sh.id||uid(), itemId, amount, cur:d.cur, date, note:(d.note||'').trim()});
    if (d.kind!=='inv') S.lastItem=itemId;
    saveMonth(k); S.sheet=null;
    toast(k!==S.cur ? `Anotado en ${monthName(k)}` : sh.id ? 'Movimiento actualizado' : d.kind==='ingreso' ? 'Ingreso registrado 💰' : d.kind==='inv' ? 'Aporte registrado 📈' : 'Gasto anotado ✓');
  } else if (sh.type==='item'){
    const name=(d.name||'').trim(); if (!name){ sh.err='Ponle un nombre'; S._focus='s-name'; return render(); }
    const m=getMonth(S.cur,true);
    const apply = it => { it.name=name; it.planned=parseNum(d.planned); it.cur=d.cur; if (d.emoji) it.emoji=d.emoji;
      if (sh.g!=='income' && sh.g!=='invest') it.bucket=d.bucket; if (sh.g==='invest' && d.acct) it.acct=d.acct; };
    if (sh.id){ const fi=findItem(m,sh.id); if (fi) apply(fi.it); }
    else { const it={id:uid()}; apply(it); m.groups[sh.g].push(it); sh.newId=it.id; }
    const spend=parseNum(d.spend), itemId=sh.id||sh.newId;
    if (spend>0){ m.tx.push({id:uid(), itemId, amount:spend, cur:d.cur, date:defDate(), note:''}); if (sh.g!=='invest') S.lastItem=itemId; }
    saveMonth(S.cur); S.sheet=null; toast(spend>0 ? itemWords(sh.g,true).done : sh.id ? 'Guardado' : 'Añadido');
  } else if (sh.type==='acct'){
    const name=(d.name||'').trim(); if (!name){ sh.err='Ponle un nombre a la cuenta'; S._focus='a-name'; return render(); }
    const g=goal(); let a=sh.id ? acctById(sh.id) : null;
    if (!a){ a={id:uid()}; g.accounts.push(a); }
    a.name=name; a.emoji=d.emoji; a.rate=Math.max(0,parseNum(d.rate)); a.rateType=d.rateType; a.initial=Math.max(0,parseNum(d.initial)); a.cur=d.cur; delete a.inGoal;
    saveSettings();
    const m=getMonth(S.cur,true);
    if (!sh.id) ensureAcctItem(m,a.id);
    const realStr=String(d.real||'').trim();
    m.balances=m.balances||{};
    if (realStr==='') delete m.balances[a.id]; else m.balances[a.id]=parseNum(realStr);
    if (!Object.keys(m.balances).length) delete m.balances;
    const add=parseNum(d.add);
    if (sh.id && add>0){ const it=ensureAcctItem(m,a.id); m.tx.push({id:uid(), itemId:it.id, amount:add, cur:a.cur||gcur(), date:defDate(), note:''}); }
    saveMonth(S.cur); S.sheet=null; toast(sh.id && add>0 ? 'Aporte registrado 📈' : sh.id?'Cuenta guardada':'Cuenta añadida');
  } else if (sh.type==='rule'){
    const n=parseNum(d.n), g=parseNum(d.g), sv=parseNum(d.s);
    if (n<0||g<0||sv<0 || Math.abs(n+g+sv-100)>0.01){ sh.err='Los tres porcentajes deben sumar 100 %'; return render(); }
    d.opts[d.active]={n,g,s:sv};
    S.settings.rule={active:d.active, opts:d.opts}; saveSettings(); S.sheet=null; toast(`Plan ${RULES[d.active].name} activado`);
  } else if (sh.type==='trm'){
    const m=getMonth(S.cur,true), v=parseNum(d.trm);
    if (v>0) m.trm=v; else delete m.trm;
    saveMonth(S.cur); S.sheet=null; toast('TRM guardada');
  }
  render();
}
function keyPress(k){
  const d=S.sheet.draft; let raw=String(d.amt||'');
  if (k==='back') raw=raw.slice(0,-1);
  else if (k===','){ if (!raw.includes(',')) raw=(raw||'0')+','; }
  else {
    const dec=raw.split(',')[1];
    if (dec!==undefined && dec.length+k.length>2) return;
    if (k==='000'){ if (!raw || raw==='0' || raw.includes(',')) return; }
    if (raw.replace(',','').length+k.length>13) return;
    raw = raw==='0' ? k : raw+k;
  }
  d.amt=raw; S.sheet.err=null;
  const el=document.getElementById('amtTxt'); if (el){ el.innerHTML=`<span class="cs">${sym(d.cur)}</span>${fmtTyping(raw)}`; fitText(); }
  const er=document.querySelector('.sheet .err'); if (er) er.remove();
}

async function exportBackup(){
  const stamp=todayDate;
  S.settings.lastBackup=new Date().toISOString(); saveSettings();
  const json=JSON.stringify({app:'mi-presupuesto', version:2, exported:S.settings.lastBackup, settings:S.settings, months:S.months}, null, 1);
  const name=`mi-presupuesto-${stamp}.json`;
  try {
    const file=new File([json], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:'Copia de Mi Presupuesto'}); toast('Copia lista'); render(); return; }
  } catch(e){ if (e && e.name==='AbortError') { render(); return; } }
  const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000); toast('Copia descargada'); render();
}
document.addEventListener('change', e => {

  r.readAsText(f);
});

    case 'planInfo': S.sheet={type:'plan', anim:true, draft:{}}; break;

      const o={n:cur.n, g:cur.g, s:cur.s}; let extra=ns-o.s; const fromG=Math.min(o.g,extra); o.g-=fromG; extra-=fromG; o.n=Math.max(0,o.n-extra); o.s=ns;
      if (r.active!=='custom') r.undo={key:r.active};

document.addEventListener('change', e => {
  const el=e.target;
  if (el.dataset.draft && S.sheet && (S.sheet.type==='rule' || S.sheet.type==='acct' || el.dataset.draft==='date')) return scheduleRender();
  if (el.dataset.draft) return;
  if (el.dataset.g){
    const k=el.dataset.g, g=S.settings.goal;
    if (k==='typical'){ g.typical = el.value.trim()==='' ? 0 : Math.max(0,parseNum(el.value)); saveSettings(); return scheduleRender(); }
    if (k==='name') g.name=el.value.trim()||'Mi meta de inversión';
    else if (k==='target') g.target=Math.max(1,parseNum(el.value)||1);
    else if (k==='start') g.start=/^\d{4}-\d{2}$/.test(el.value) ? el.value : todayKey;
    else if (k==='years') g.years=Math.max(1,Math.min(40,Number(el.value)||1));
    saveSettings(); return scheduleRender();
  }
  if (el.dataset.set){
    const k=el.dataset.set;
    if (k==='trm'){ const v=parseNum(el.value); if (v>0) S.settings.trm=v; }
    else if (k==='rules') S.settings.rules=el.value;
    saveSettings(); return scheduleRender();
  }
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape' && S.sheet){ S.sheet=null; render(); return; }
  const typing = e.target.matches && e.target.matches('input,textarea,select');
  if (S.sheet && S.sheet.type==='tx' && !typing){
    if (/^[0-9]$/.test(e.key)){ keyPress(e.key); e.preventDefault(); return; }
    if (e.key===',' || e.key==='.'){ keyPress(','); e.preventDefault(); return; }
    if (e.key==='Backspace'){ keyPress('back'); e.preventDefault(); return; }
    if (e.key==='Enter'){ e.preventDefault(); sheetSave(); return; }
  }
  if (e.key==='Enter' && e.target.tagName==='INPUT'){
    if (S.sheet && e.target.closest('.sheet')){ e.preventDefault(); e.target.blur(); sheetSave(); }
    else e.target.blur();
  }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='hidden') flushAll(); else if (S.mode!=='loading') fetchTRM(false); });
if (window.matchMedia) try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch(e){}
window.addEventListener('pagehide', flushAll);

boot();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
